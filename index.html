<title>오머먹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 점무늬 배경 위에 말랑한 스티커 카드를 올린 모바일 앱. 하단 탭 3개, 한가운데 큼직한 메뉴 스티커 하나가 주인공. */
:root {
  --bg: #EAF5EE;
  --dot: #D1E6D8;
  --surface: #FFFFFF;
  --ink: #22302A;
  --muted: #5A6B61;
  --edge: #C9DFD0;
  --edge-shadow: #B5D0BE;
  --accent: #1D7A55;
  --accent-deep: #135A3E;
  --accent-ink: #FFFFFF;
  --tint: #DDF0E4;
  --pop: #FFC83D;
  --pop-ink: #3A2A00;
  --pink: #FF8FA3;
  --hot: #E8573F;
  --oil: #F5A623;
  --font-display: 'Jua', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1713; --dot: #17231C; --surface: #18221C; --ink: #E9F1EB; --muted: #9BAFA2;
    --edge: #2B3D32; --edge-shadow: #0A100D; --accent: #4FC08D; --accent-deep: #2E8F66; --accent-ink: #07140D;
    --tint: #20332A; --hot: #FF7A63; --oil: #FFB547;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1713; --dot: #17231C; --surface: #18221C; --ink: #E9F1EB; --muted: #9BAFA2;
  --edge: #2B3D32; --edge-shadow: #0A100D; --accent: #4FC08D; --accent-deep: #2E8F66; --accent-ink: #07140D;
  --tint: #20332A; --hot: #FF7A63; --oil: #FFB547;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.7px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  word-break: keep-all; overflow-wrap: break-word;
  padding-block: 18px 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 23px; text-wrap: balance; line-height: 1.25; }
h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 27px; letter-spacing: .01em; }
.date { color: var(--muted); font-size: 13px; background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 12px; }
.muted, .hint { color: var(--muted); font-size: 13px; }
.label { font-size: 13px; color: var(--muted); font-weight: 700; }

.card { background: var(--surface); border: 2px solid var(--edge); border-radius: 26px; box-shadow: 0 5px 0 var(--edge-shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.h-ico { display: flex; align-items: center; gap: 10px; }

/* 스티커 타일 */
.tile { --s: 72px; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .34); background: var(--tile, var(--tint)); display: grid; place-items: center; flex: none; box-shadow: 0 3px 0 rgba(74, 52, 40, .14); }
.tile .fi { width: 80%; height: 80%; }
.tile.lg { --s: 124px; transform: rotate(-4deg); animation: pop .4s ease-out; box-shadow: 0 6px 0 rgba(74, 52, 40, .16); }
.tile.md { --s: 66px; }
.tile.sm { --s: 50px; border-radius: 16px; }
.tile.xs { --s: 36px; border-radius: 12px; box-shadow: 0 2px 0 rgba(74, 52, 40, .14); }
.fi { display: block; width: 100%; height: 100%; }
.mi { width: 24px; height: 24px; border-radius: 50%; background: #fff; display: inline-grid; place-items: center; flex: none; }
.mi .fi { width: 20px; height: 20px; }
.gl { width: 22px; height: 22px; display: block; flex: none; }
@keyframes pop { 0% { transform: scale(.8) rotate(-12deg); } 60% { transform: scale(1.07) rotate(-2deg); } 100% { transform: scale(1) rotate(-4deg); } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; padding: 6px 14px 6px 8px; border-radius: 999px; border: 2px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; transition: background .15s, color .15s, transform .1s; min-height: 40px; }
.chip:not(:has(.mi)) { padding-left: 14px; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-deep); color: var(--accent-ink); font-weight: 700; }
.chip.small { font-size: 13px; padding: 4px 12px; min-height: 38px; }
.chip.static { cursor: default; background: var(--tint); border-color: transparent; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border: 2px solid var(--edge); border-radius: 18px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 6px; border-radius: 14px; cursor: pointer; font-weight: 500; font-size: 13px; line-height: 1.3; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 3px 0 var(--accent-deep); }
html[lang="en"] .seg[aria-label="My Page"] { overflow-x: auto; scrollbar-width: none; grid-auto-columns: max-content; }
html[lang="en"] .seg[aria-label="My Page"] button { white-space: nowrap; padding: 9px 14px; }
.seg.big button { font-size: 16px; font-family: var(--font-display); font-weight: 400; }

.btn { font-weight: 700; font-size: 15px; border-radius: 18px; padding: 12px 18px; border: 2px solid var(--edge); background: var(--surface); color: var(--ink); cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; box-shadow: 0 4px 0 var(--edge-shadow); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-shadow); }
.btn.primary { background: var(--accent); border-color: var(--accent-deep); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep); }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-deep); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:active { transform: none; }
.btn.small { min-height: 42px; padding: 8px 14px; font-size: 14px; border-radius: 14px; box-shadow: 0 3px 0 var(--edge-shadow); }
.btn.ghost.small { box-shadow: none; }
.btn.danger { color: var(--hot); border-color: var(--hot); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; }

.progress { height: 10px; background: var(--surface); border: 2px solid var(--edge); border-radius: 10px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 10px; transition: width .25s; }
.step-count { font-size: 13px; color: var(--muted); }

/* 오늘의 메뉴 카드 */
.hero { align-items: center; text-align: center; gap: 10px; padding-top: 18px; }
.hero > * { max-width: 100%; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 700; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.stage { position: relative; width: 100%; display: grid; place-items: center; padding: 8px 0 4px; }
.spark { position: absolute; width: 20px; height: 20px; color: var(--pop); }
.spark.a { top: 10px; left: calc(50% - 88px); }
.spark.b { bottom: 14px; right: calc(50% - 92px); width: 14px; height: 14px; color: var(--pink); }
.spark.c { top: 34px; right: calc(50% - 84px); width: 11px; height: 11px; color: var(--accent); }
.dish { font-size: 36px; line-height: 1.15; }
.desc { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.ind { display: inline-flex; gap: 1px; }
.ind .gl { width: 16px; height: 16px; }
.ind.hot { color: var(--hot); }
.ind.oil { color: var(--oil); }
.ind .off { opacity: .22; }
.why { display: flex; flex-wrap: wrap; gap: 6px; }
.hero .why { justify-content: center; }
.why span { font-size: 12px; background: var(--tint); padding: 3px 11px; border-radius: 999px; }
.badge { background: var(--pop); color: var(--pop-ink); font-size: 12px; font-weight: 700; padding: 3px 11px; border-radius: 999px; }
.note { font-size: 12px; color: var(--muted); }
.hero .row { width: 100%; margin-top: 4px; }

.alts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.alts button { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border: 2px solid var(--edge); border-radius: 20px; background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--edge-shadow); }
.alts button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge-shadow); }
.alts .t { display: flex; flex-direction: column; min-width: 0; }
.alts .n { font-family: var(--font-display); font-size: 19px; line-height: 1.25; }
.alts .s { font-size: 12px; color: var(--muted); }

.field-row { display: flex; gap: 8px; }
.field { font-family: inherit; font-size: 16px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--edge); background: var(--bg); color: var(--ink); min-width: 0; flex: 1; }

.day-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.slot { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.slot + .slot { border-top: 2px dashed var(--edge); padding-top: 16px; }
.slot .body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot .meal { font-size: 12px; font-weight: 700; color: var(--accent); }
.slot .name { font-family: var(--font-display); font-size: 23px; line-height: 1.2; }
.slot .meta { justify-content: flex-start; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }

#nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--edge); border-radius: 24px 24px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
#nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
#nav button { border: 0; background: transparent; color: var(--muted); padding: 7px 2px; border-radius: 18px; cursor: pointer; font-weight: 500; font-size: 10.5px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; }
#nav button .gl { width: 24px; height: 24px; }
#nav button[aria-current="page"] { color: var(--accent); background: var(--tint); font-weight: 700; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 9; max-width: calc(100% - 32px); text-align: center; }

/* 머먹쥐 */
.say { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.mouse { width: 76px; height: 76px; flex: none; display: block; animation: bob 2.8s ease-in-out infinite; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--edge); border-radius: 20px; padding: 10px 15px; font-family: var(--font-display); font-size: 18px; line-height: 1.35; box-shadow: 0 3px 0 var(--edge-shadow); text-wrap: balance; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 50%; width: 12px; height: 12px; background: var(--surface); border-left: 2px solid var(--edge); border-bottom: 2px solid var(--edge); transform: translateY(-50%) rotate(45deg); }
.hero .bubble { background: var(--tint); box-shadow: none; }
.hero .bubble::before { background: var(--tint); }
.bname { display: flex; flex-direction: column; line-height: 1.1; }
.bname small { font-family: var(--font-body); font-size: 11px; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
.tile.xs .fi { width: 92%; height: 92%; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* 랜덤 뽑기 */
.wheel { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 5px 0 rgba(74, 52, 40, .15)); }
.wheel .wl { font-family: var(--font-display); }
.lad { width: 100%; height: auto; display: block; margin: 0 auto; }
.lad .ln { stroke: var(--muted); stroke-width: 3; stroke-linecap: round; opacity: .55; }
.lad .lp { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.lad .tok { cursor: pointer; }
.lad .tok:focus-visible { outline: none; }
.lad .tok:focus-visible circle { stroke: var(--accent); stroke-width: 5; }
.lad .slot-b { fill: var(--surface); stroke: var(--edge); stroke-width: 2; }
.lad .q { font-family: var(--font-display); font-size: 24px; fill: var(--muted); }
.lad .sl { font-family: var(--font-body); font-size: 10px; fill: var(--ink); }
.lad .slot-b.win { stroke: var(--accent); stroke-width: 4; }
.askbox { width: 100%; background: var(--tint); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.askrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.askrow .dl { font-size: 13px; font-weight: 700; min-width: 104px; }
.hero .row { width: 100%; }
.hero .row > .btn { flex: 1 1 130px; }
.between { justify-content: space-between; align-items: center; flex-wrap: nowrap; }

/* 캘린더 */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; padding-bottom: 2px; }
.dow.red { color: var(--hot); }
.cd { position: relative; aspect-ratio: 1 / 1.2; border: 2px solid transparent; border-radius: 14px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 3px 0 0; gap: 1px; cursor: pointer; color: var(--ink); min-width: 0; }
.cd.empty { visibility: hidden; cursor: default; }
.cd .dn { font-size: 11.5px; font-weight: 700; line-height: 1.2; }
.cd.red .dn { color: var(--hot); }
.cd .fi { width: 74%; max-width: 32px; height: auto; display: block; }
.cd.today { border-color: var(--accent); }
.cd.sel { background: var(--tint); border-color: var(--accent-deep); }

ata-act=\"bkmake\">Create backup code<\/button><\/div>", "<\/textarea><div><button type=\"button\" class=\"btn small\" data-act=\"bkcopy\">코드 복사<\/button><\/div>": "<\/textarea><div><button type=\"button\" class=\"btn small\" data-act=\"bkcopy\">Copy code<\/button><\/div>", "<label class=\"label\" for=\"bkin\">복원할 백업 코드<\/label><textarea id=\"bkin\" class=\"field\" rows=\"3\" placeholder=\"OMM1: 로 시작하는 코드를 붙여 넣어 줘\"><\/textarea>": "<label class=\"label\" for=\"bkin\">Backup code to restore<\/label><textarea id=\"bkin\" class=\"field\" rows=\"3\" placeholder=\"Paste a code that starts with OMM1:\"><\/textarea>", "정말 덮어쓸게": "Yes, overwrite", "복원하기": "Restore", "<section class=\"card\"><h2>차단한 사용자<\/h2>": "<section class=\"card\"><h2>Blocked users<\/h2>", "익명": "Anonymous", "\">해제<\/button><\/div>": "\">Unblock<\/button><\/div>", "<p class=\"hint\">차단한 사용자의 글은 게시판에서 보이지 않아.<\/p>": "<p class=\"hint\">Posts from blocked users are hidden on the board.<\/p>", "<p class=\"hint\">차단한 사용자가 없어. 게시판의 신고 버튼에서 차단할 수 있어.<\/p>": "<p class=\"hint\">No blocked users. You can block someone from the report button on the board.<\/p>", "2026년 11월 18일": "November 18, 2026", "1. 서비스": "1. Service", "오머먹은 취향에 맞는 식사·디저트 메뉴를 추천하고, 룰렛·사다리로 메뉴를 정하며, 캘린더 기록·출석체크·게시판 등을 제공하는 서비스야.": "Omeomeok recommends meals and desserts that fit your taste, helps you decide with roulette and ladder games, and offers a calendar log, check-ins, and a board.", "2. 추천과 알러지 정보": "2. Recommendations and allergy info", "메뉴의 재료와 알러지 정보는 일반적인 조리법 기준의 참고용이야. 식당마다 재료가 달라 주문 전에 꼭 확인해야 하며, 알러지·건강 문제로 생기는 결과는 서비스가 책임지지 않아. 식당 정보는 앱에 저장되지 않고 지도 앱 검색으로 연결돼.": "Ingredient and allergy info for menus is a reference based on typical recipes. Ingredients differ by restaurant, so you must check before ordering, and the service isn't responsible for results from allergy or health issues. Restaurant info isn't stored in the app; it links to map app searches.", "3. 포인트·레벨·칭호": "3. Points, levels and titles", "포인트는 앱 안에서만 쓰는 가상의 점수야. 현금이나 상품으로 바꿀 수 없고, 다른 사람에게 양도할 수 없어. 기기 데이터가 지워지면 사라질 수 있고, 부정한 방법(기기 시간 조작, 반복 계정 등)으로 얻은 포인트는 회수될 수 있어.": "Points are virtual scores used only inside the app. They can't be exchanged for cash or goods and can't be transferred to others. They may disappear if device data is deleted, and points earned by improper means (changing device time, repeated accounts, etc.) may be taken back.", "4. 게시판 이용 규칙": "4. Board rules", "게시글 작성 시 얼굴이나 몸매 등 신체가 노출되는 사진은 올릴 수 없어. 욕설·비방·광고성 글, 타인의 권리를 침해하는 글도 금지돼. 위반한 글은 삭제될 수 있고, 반복되면 이용이 제재될 수 있어. 이용자는 신고 기능으로 부적절한 글을 알릴 수 있어.": "You can't post photos that show your face or body. Profanity, slander, advertising, and posts that infringe others' rights are also prohibited. Violating posts may be deleted, and repeated violations may lead to restricted use. Users can report inappropriate posts with the report feature.", "5. 이용 제한 연령": "5. Age limit", "만 14세 미만은 이 서비스를 이용할 수 없어.": "Children under 14 can't use this service.", "6. 서비스 변경": "6. Changes to the service", "서비스 내용과 이 약관은 바뀔 수 있고, 바뀌면 앱 안에서 알려.": "The service and these terms may change, and we'll tell you in the app when they do.", "1. 수집하는 정보와 이용 목적": "1. Information we collect and why", "• 성별·나이대(이용자가 직접 선택): 메뉴 추천과 머먹쥐 편지 작성. 다른 이용자에게 공개되지 않고 게시판에도 표시되지 않아.\n• 취향 정보(좋아하는 음식, 술·맵기·느끼함 선호, 싫어하는 재료): 메뉴 추천\n• 알러지 정보(선택 동의): 해당 성분이 든 메뉴를 추천에서 제외. 건강과 관련된 정보라서 따로 동의를 받아.\n• 잠금 비밀번호(선택): 앱 열 때 본인 확인. 비밀번호 자체가 아니라 해시값만 이 기기에 저장돼.\n• 닉네임, 메뉴 선택·인증 기록, 출석·포인트·레벨 기록: 서비스 기능 제공\n• 인증 사진(카메라로 직접 촬영): 메뉴 인증. 이 기기 안에만 저장되고 서버로 보내지 않아.\n• 게시글(메뉴 이름, 한마디, 닉네임, 레벨, 최애 음식 Top3(입력한 경우), 첨부한 음식 사진), 좋아·신고 기록, 이용자 식별 번호: 공유 게시판 운영. 게시판에 올린 사진은 다른 이용자에게 보여. 사진은 작게 줄여 올라가며 촬영 위치 같은 정보는 지워져.": "• Gender and age group (chosen by you): menu recommendations and writing Meomeokjwi's letters. Not shown to other users and not displayed on the board.\n• Taste info (liked foods, drink, spice and richness preferences, disliked ingredients): menu recommendations\n• Allergy info (optional consent): leaves menus containing those ingredients out of recommendations. It's health-related, so we ask for separate consent.\n• Lock password (optional): to confirm it's you when opening the app. Only a hash is stored on this device, not the password itself.\n• Nickname, menu choices and verification records, check-in, points and level records: providing service features\n• Verification photos (taken directly with the camera): menu verification. Stored only on this device and never sent to a server.\n• Posts (menu name, comment, nickname, level, Top 3 favorite foods (if entered), attached food photos), likes and report records, user ID: running the shared board. Photos posted to the board are visible to other users. Photos are shrunk when uploaded and info like shooting location is removed.", "2. 저장 위치와 보유 기간": "2. Where it's stored and how long", "취향·기록·포인트·인증 사진은 이 기기의 브라우저 저장소에만 저장돼. 앱 데이터를 지우거나 마이페이지의 \"내 데이터 모두 삭제\"를 누르면 삭제돼. 공유 게시판에 올린 글·좋아·신고 기록은 서비스 저장소에 저장되며, 글은 직접 삭제하거나 삭제를 요청할 때까지 보관돼.": "Preferences, records, points, and verification photos are stored only in this device's browser storage. They're deleted when you clear app data or tap \"Delete all my data\" in My page. Posts, likes, and reports on the shared board are stored in the service storage, and posts are kept until you delete them or ask for deletion.", "3. 제3자 제공과 처리 위탁": "3. Third-party sharing and processing", "수집한 정보를 광고나 마케팅 목적으로 제3자에게 제공하지 않아. 공유 게시판의 데이터 저장은 서비스 제공을 위해 클라우드 저장소를 이용해.": "We don't give collected information to third parties for advertising or marketing. The shared board's data is stored using cloud storage to provide the service.", "4. 외부 서비스": "4. External services", "• 글꼴은 Google Fonts에서 불러오며, 이때 접속 정보(IP 주소 등)가 Google에 전달될 수 있어.\n• 네이버지도·카카오맵 링크를 열면 해당 서비스의 정책이 적용돼.\n• 현재 광고는 예시 화면이야. 실제 광고를 도입하면 광고 식별자 등 처리 내용을 이 방침에 미리 알려.": "• Fonts are loaded from Google Fonts, and connection info (such as IP address) may be passed to Google.\n• Opening Naver Map or Kakao Map links applies those services' policies.\n• Ads are currently a sample screen. If real ads are introduced, we'll tell you in advance in this policy about processing such as ad identifiers.", "5. 이용자의 권리": "5. Your rights", "마이페이지에서 내 정보와 기록을 확인할 수 있고, \"정책\" 메뉴에서 알러지 정보 동의를 철회하거나 내 데이터를 모두 삭제할 수 있어. 게시글은 글의 삭제 버튼으로 지울 수 있어. 동의를 철회하면 앱을 계속 이용하기 어려울 수 있어.": "You can check your info and records in My page, and withdraw allergy-info consent or delete all your data from the \"Policy\" menu. You can delete posts with each post's delete button. If you withdraw consent, it may be hard to keep using the app.", "6. 만 14세 미만": "6. Under 14", "만 14세 미만 아동의 정보는 수집하지 않으며, 이용할 수 없어.": "We don't collect information from children under 14, and they can't use the service.", "7. 안전성 확보": "7. Security", "불필요한 정보는 수집하지 않고, 개인정보는 이 기기 안에 두는 것을 기본으로 해.": "We don't collect unnecessary information, and by default keep personal information on this device.", "8. 문의": "8. Contact", "개인정보 관련 문의: ": "Privacy inquiries: ", "개인정보 관련 문의는 앱의 신고 기능 또는 스토어 문의 채널로 남겨 줘.": "Please leave privacy inquiries through the app's report feature or the store's contact channel.", "9. 방침 변경": "9. Policy changes", "이 방침은 ": "This policy applies from ", "부터 적용돼. 내용이 바뀌면 앱 안에서 알려.": ". If it changes, we'll tell you in the app.", "게시글 작성 시 얼굴이나 몸매 등 신체가 노출되는 사진은 올릴 수 없어. 이를 어기면 글이 삭제되고 이용 제재 대상이 될 수 있어. 욕설·비방·광고성 글도 마찬가지야. 부적절한 글은 각 글의 신고 버튼으로 알려 줘.": "You can't post photos that show your face or body. If you do, the post will be deleted and you may be restricted. The same goes for profanity, slander, and ads. Report inappropriate posts with each post's report button.", "동의 없이는 쓸 수 없어…": "You can't use it without consent…", "<p class=\"desc\">서비스 이용에 꼭 필요한 정보라서, 필수 항목에 동의하지 않으면 오머먹을 쓸 수 없어. 마음이 바뀌면 다시 볼 수 있어.<\/p><button type=\"button\" class=\"btn primary go\" data-act=\"cretry\">약관 다시 보기<\/button>": "<p class=\"desc\">This information is essential to use the service, so you can't use Omeomeok without agreeing to the required items. You can look again if you change your mind.<\/p><button type=\"button\" class=\"btn primary go\" data-act=\"cretry\">Review terms again<\/button>", "시작하기 전에 확인해 줘!": "Please check before we start!", "<p class=\"hint\">오머먹은 취향 정보와 기록을 이 기기에 저장해. 아래 내용을 확인하고 동의해 줘. 이 안내는 처음 한 번만 나와.<\/p>": "<p class=\"hint\">Omeomeok stores your taste info and records on this device. Please read below and agree. This notice appears only the first time.<\/p>", "<label class=\"crow all\"><input type=\"checkbox\" class=\"cchk\" data-k=\"all\"><span>전체 동의 (선택 포함)<\/span><\/label>": "<label class=\"crow all\"><input type=\"checkbox\" class=\"cchk\" data-k=\"all\"><span>Agree to all (including optional)<\/span><\/label>", "<label class=\"crow\"><input type=\"checkbox\" class=\"cchk req\" data-k=\"age\"><span><b class=\"rq\">필수<\/b> 만 14세 이상이야<\/span><\/label>": "<label class=\"crow\"><input type=\"checkbox\" class=\"cchk req\" data-k=\"age\"><span><b class=\"rq\">Required<\/b> I'm 14 or older<\/span><\/label>", "<label class=\"crow\"><input type=\"checkbox\" class=\"cchk req\" data-k=\"terms\"><span><b class=\"rq\">필수<\/b> 이용약관 동의<\/span><\/label>": "<label class=\"crow\"><input type=\"checkbox\" class=\"cchk req\" data-k=\"terms\"><span><b class=\"rq\">Required<\/b> Agree to Terms of Use<\/span><\/label>", "<label class=\"crow\"><input type=\"checkbox\" class=\"cchk req\" data-k=\"priv\"><span><b class=\"rq\">필수<\/b> 개인정보 수집·이용 동의<\/span><\/label>": "<label class=\"crow\"><input type=\"checkbox\" class=\"cchk req\" data-k=\"priv\"><span><b class=\"rq\">Required<\/b> Agree to collection and use of personal info<\/span><\/label>", "<label class=\"crow\"><input type=\"checkbox\" class=\"cchk\" data-k=\"alg\"><span><b class=\"op\">선택<\/b> 알러지(건강 관련) 정보 수집·이용 동의 — 동의하면 알러지 성분이 든 메뉴를 빼고 추천해<\/span><\/label>": "<label class=\"crow\"><input type=\"checkbox\" class=\"cchk\" data-k=\"alg\"><span><b class=\"op\">Optional<\/b> Agree to collection and use of allergy (health) info — if you agree, menus with those ingredients are left out<\/span><\/label>", "이용약관 보기": "View Terms of Use", "개인정보 처리방침 보기": "View Privacy Policy", "<div class=\"row\"><button type=\"button\" class=\"btn grow\" data-act=\"cdecline\">동의하지 않아<\/button><button type=\"button\" class=\"btn primary grow\" id=\"cgo\" data-act=\"cagree\" disabled>동의하고 시작하기<\/button><\/div>": "<div class=\"row\"><button type=\"button\" class=\"btn grow\" data-act=\"cdecline\">I don't agree<\/button><button type=\"button\" class=\"btn primary grow\" id=\"cgo\" data-act=\"cagree\" disabled>Agree and start<\/button><\/div>", "저장 공간이 부족해서 동의를 저장하지 못했어": "Not enough storage to save your consent", "고마워! 같이 맛있는 거 골라 보자": "Thanks! Let's pick tasty food together", "알러지 정보 수집에 동의했어": "You agreed to collecting allergy info", "알러지 정보 동의를 철회하고 저장한 알러지를 지웠어": "Allergy consent withdrawn and saved allergies deleted", "삭제했어. 앱을 다시 열어 줘": "Deleted. Please reopen the app", "<section class=\"card\"><h2>내 데이터 삭제 · 동의 철회<\/h2><p class=\"hint\">이 기기에 저장된 취향, 기록, 포인트, 인증 사진, 동의 내역을 모두 지우고 처음 상태로 돌아가. 되돌릴 수 없어. 공유 게시판에 올린 글은 각 글의 삭제 버튼으로 지워 줘.<\/p>": "<section class=\"card\"><h2>Delete my data · withdraw consent<\/h2><p class=\"hint\">Erases all preferences, records, points, verification photos, and consent history stored on this device and returns to the initial state. This can't be undone. Delete posts on the shared board with each post's delete button.<\/p>", "정말 모두 삭제할게": "Yes, delete everything", "내 데이터 모두 삭제": "Delete all my data", "<span>약관 · 개인정보<\/span><\/h2>": "<span>Terms · Privacy<\/span><\/h2>", "<div class=\"stat\"><span>필수 동의 (이용약관 · 개인정보 수집·이용)<\/span><b>": "<div class=\"stat\"><span>Required consent (Terms of Use · personal info)<\/span><b>", "완료": "Done", "<div class=\"stat\"><span>동의한 날<\/span><b>": "<div class=\"stat\"><span>Date of consent<\/span><b>", "<div class=\"stat\"><span>알러지 정보 수집 동의 (선택)<\/span><b>": "<div class=\"stat\"><span>Allergy info consent (optional)<\/span><b>", "동의함": "Agreed", "동의 안 함": "Not agreed", "알러지 정보 동의 철회": "Withdraw allergy info consent", "알러지 정보 수집 동의하기": "Agree to allergy info collection", "이용약관": "Terms of Use", "개인정보 처리방침": "Privacy Policy", "<details class=\"doc\"><summary>게시판 이용 규칙<\/summary><p>": "<details class=\"doc\"><summary>Board rules<\/summary><p>", "시간 ": "h ", "분": "m", "1분": "1m", "오늘 출석은 3번 다 했어. 자정 이후에 다시 할 수 있어": "You've checked in 3 times today. Try again after midnight", "다음 출석까지 ": "Next check-in in ", " 남았어": " left", "저장 공간이 부족해서 출석을 저장하지 못했어": "Not enough storage to save the check-in", "출석체크 완료! +": "Check-in done! +", "P (오늘 ": "P (today ", "오늘 출석체크 완료 · ": "Checked in today · ", "회": "x", "메뉴는 정했어. 출석체크도 해 볼까?": "You picked a menu. Want to check in too?", "오늘 아직 출석 전이야": "You haven't checked in yet today", "지금 출석할 수 있어 (+": "You can check in now (+", "오늘은 모두 했어. 자정이 지나면 다시 할 수 있어": "All done today. Try again after midnight", "<span>출석체크<\/span><\/h2>": "<span>Check-in<\/span><\/h2>", "<span class=\"badge\">출석체크 완료<\/span> ": "<span class=\"badge\">Checked in<\/span> ", "출석체크 하기 +": "Check in +", "<p class=\"hint\">하루 최대 3번, 4시간 간격 · 자정에 초기화 · 총 ": "<p class=\"hint\">Up to 3 times a day, 4 hours apart · resets at midnight · total ", "회 출석<\/p>": " check-ins<\/p>", "월 출석 도장<\/h3>": " check-in stamps<\/h3>", "개<\/b><p class=\"hint\">": "<\/b><p class=\"hint\">", "일 출석 · 하루 3번 다 찍은 날 ": " days checked in · days with all 3 stamps: ", "일<\/p><\/div><\/div>": " days<\/p><\/div><\/div>", "<div class=\"stat\"><span>지금까지 총 출석<\/span><b>": "<div class=\"stat\"><span>Total check-ins so far<\/span><b>", "회 (": " times (", "홈": "Home", "홈에서 오늘 뭐 먹지?": "What to eat today at Home?", "<b>홈<\/b> 맨 위의 <b>오늘 식사 · 휴일 외식 · 랜덤 뽑기<\/b> 버튼으로 화면을 바꿔. 오늘 식사에서는 아침·점심·저녁·디저트를 고르면 내 취향에 맞는 메뉴를 추천해 줘. 누르면 오늘의 메뉴로 정해지고, 마음에 들면 <b>♥ 내 최애로 등록<\/b>도 할 수 있어.": "Use the <b>Today's meal · Days-off meals · Random pick<\/b> buttons at the top of <b>Home<\/b> to switch screens. In Today's meal, choose breakfast, lunch, dinner or dessert and I'll recommend menus that fit your taste. Tap to set it as today's menu, and if you love it you can also <b>♥ Add to my favorites<\/b>.", "휴일·데이트": "Days off · Dates", "휴일 외식과 데이트 맛집": "Days-off meals and date spots", "<b>휴일 외식<\/b>에서는 이번 주 쉬는 날에 먹을 메뉴를 골라 줘. <b>데이트 맛집<\/b>은 분위기를 고르면 식사 → 디저트 코스를 추천해 줘. 동네를 넣으면 네이버지도·카카오맵 검색으로 바로 이어져.": "In <b>Days-off meals<\/b>, pick menus for the days you rest this week. For <b>Date spots<\/b>, choose a mood and I'll suggest a meal → dessert course. Enter a neighborhood to jump straight into Naver Map or Kakao Map searches.", "랜덤 뽑기": "Random pick", "못 고르겠으면 맡겨 줘!": "Can't decide? Leave it to me!", "<b>랜덤 뽑기<\/b>(홈)에서 룰렛이나 사다리 타기로 정해 봐. 결과를 오늘 메뉴나 휴일 메뉴로 바로 정할 수 있어.": "In <b>Random pick<\/b> (Home), decide with roulette or ladder. You can set the result as today's menu or a days-off menu right away.", "캘린더 · 출석 도장 · 내 휴일": "Calendar · Check-in stamps · My days off", "정한 메뉴는 <b>캘린더<\/b>에 쌓여. 메뉴를 먹고 <b>카메라로 바로 찍어 인증<\/b>하면 50P야. <b>출석체크는 캘린더에서만<\/b> 해: 한 번에 10P, 하루 3번, 4시간 간격이고 날짜마다 <b>도장<\/b>이 찍혀. 쉬는 요일이 주말이 아니면 캘린더에서 <b>내 휴일<\/b>을 직접 정해 줘.": "Menus you pick pile up in the <b>Calendar<\/b>. Eat the menu and <b>take a photo with the camera to verify<\/b> for 50P. <b>Check in only in the calendar<\/b>: 10P each, up to 3 times a day, 4 hours apart, and a <b>stamp<\/b> is added to each date. If your days off aren't the weekend, set <b>My days off<\/b> yourself in the calendar.", "게시판": "Board", "이거 맛있겠쥐? 게시판": "Looks tasty, right? Board", "<b>게시판<\/b>에 먹은 메뉴를 사진과 함께 올리고 다른 사람 글에 좋아요를 눌러 봐. 좋아 1개당 글쓴이에게 1P가 가. 글에는 내 <b>최애 Top3<\/b>가 같이 보여(마이 → 내 정보에서 정해). 얼굴이나 몸이 드러나는 사진은 올릴 수 없어.": "On the <b>Board<\/b>, post menus you ate with photos and like other people's posts. Each like gives the writer 1P. Your <b>Top 3 favorites<\/b> show with your posts (set them in My → My info). You can't post photos showing your face or body.", "레벨": "Level", "레벨은 누적 포인트로 올라": "Levels rise with total points", "포인트가 쌓이면 머먹쥐 레벨이 올라가. 레벨업할 때마다 <b>성장일기 영상<\/b>이 열리고, <b>머먹쥐 탭 → 성장일기<\/b>에서 다시 볼 수 있어. 레벨은 누적 포인트 기준이라 포인트를 써도 절대 내려가지 않아.": "As points pile up, Meomeokjwi's level rises. Each time you level up, a <b>growth diary video<\/b> unlocks, and you can rewatch it in <b>Meomeokjwi tab → Growth diary<\/b>. Levels are based on total points, so spending points never lowers them.", "머먹쥐": "Meomeokjwi", "머먹쥐 꾸미기 · 방 · 먹이 주기": "Dress up · Room · Feeding", "<b>머먹쥐 탭<\/b>에서 쓸 수 있는 포인트로 <b>상점<\/b>의 옷 가게·장신구 가게에서 옷과 장신구를 사서 <b>옷장<\/b>에서 입혀 봐. 장신구가 옷보다 비싸. <b>방<\/b>은 옷과 따로 꾸미는 공간이고, 가구 가게의 가구는 장신구보다 더 비싸. <b>먹이<\/b>를 주면 한 번에 +10P(하루 3번, 최대 30P)를 받고, 먹는 모습도 볼 수 있어. 세 가지 먹이 중 하나만 골라 먹이면 배가 가득 차고, 포만감이 줄어서 출출해져야 다시 줄 수 있어. 머먹쥐는 시간대나 포만감에 따라 말도 걸어.": "In the <b>Meomeokjwi tab<\/b>, use spendable points to buy clothes and accessories from the clothes and accessory shops in the <b>Shop<\/b>, then dress up in the <b>Closet<\/b>. Accessories cost more than clothes. The <b>Room<\/b> is decorated separately from clothes, and furniture from the furniture shop costs more than accessories. <b>Feeding<\/b> earns +10P each time (3 times a day, up to 30P) and you can watch it eat. Pick just one of three foods to feed and it gets full; you can feed again once it's hungry. Meomeokjwi also talks to you depending on the time of day and how full it is.", "잠금": "Lock", "내 계정 · 잠금 비밀번호": "My account · lock password", "오머먹은 서버에 가입하는 방식이 아니라 <b>이 기기에 내 프로필<\/b>을 만들어. 같이 쓰는 폰이라면 <b>마이 → 내 계정<\/b>에서 <b>비밀번호(숫자 4~8자리)<\/b>를 정해 둬. 앱을 열 때마다 물어보고, 5분 넘게 떠나 있다 돌아와도 다시 물어봐. 비밀번호를 잊으면 데이터를 지워야 하니까 <b>백업 코드<\/b>를 꼭 만들어 둬. 기기를 바꿀 때도 백업 코드를 붙여 넣으면 돼.": "Omeomeok isn't a service you sign up for on a server; it creates <b>your profile on this device<\/b>. If you share a phone, set a <b>password (4–8 digits)<\/b> in <b>My → My account<\/b>. It asks every time you open the app, and again if you've been away for over 5 minutes. If you forget the password you'll have to delete your data, so be sure to create a <b>backup code<\/b>. When you change devices, paste the backup code too.", "편지": "Letters", "기념일 편지": "Anniversary letters", "우리가 함께한 지 <b>7일 · 30일 · 50일 · 100일…<\/b> 그리고 매년 기념일이 되면 머먹쥐가 <b>편지<\/b>를 써 줘. 네 성별·나이대, 먹은 기록, 최애 음식, 옷 같은 걸 조합해서 쓰기 때문에 사람마다 편지가 달라. 편지는 <b>머먹쥐 탭 → 일기·편지<\/b>의 편지함에서 다시 읽을 수 있고, 예시 편지도 미리 볼 수 있어. 성별·나이대는 다른 이용자에게 보이지 않아.": "When we've been together <b>7 days · 30 days · 50 days · 100 days…<\/b> and every anniversary, Meomeokjwi writes you a <b>letter<\/b>. It mixes your gender and age group, eating history, favorite foods and outfits, so every person's letter is different. You can reread letters in the mailbox under <b>Meomeokjwi tab → Diary · Letters<\/b>, and preview a sample letter too. Your gender and age group aren't shown to other users.", "마이": "My", "마이페이지 살펴보기": "Looking around My page", "<b>마이<\/b>에서 닉네임과 <b>최애 음식 Top3<\/b>를 바꿔. <b>내 정보<\/b>에서 <b>머먹쥐 포토카드<\/b>를 만들어 공유하고, 이번 달 먹은 통계도 볼 수 있어. 배경 음악·효과음 볼륨은 <b>소리<\/b>에서 조절해. 잠금 비밀번호와 백업 코드는 <b>내 계정<\/b>에 있어. 취향은 <b>내 취향<\/b>에서 고치고, <b>앱으로 쓰기<\/b>에서 홈 화면에 추가하는 방법을 알려 줘. 기기를 바꿀 땐 <b>내 계정<\/b>의 백업 코드를 써.": "In <b>My<\/b>, change your nickname and <b>Top 3 favorite foods<\/b>. In <b>My info<\/b>, make and share a <b>Meomeokjwi photo card<\/b>, and see this month's eating stats. Adjust background music and sound effect volume in <b>Sound<\/b>. The lock password and backup code are in <b>My account<\/b>. Fix your tastes in <b>Preferences<\/b>, and <b>Use as an app<\/b> shows how to add it to your home screen. When you change devices, use the backup code in <b>My account<\/b>.", "<div class=\"gwrap\"><nav class=\"gmenu\" aria-label=\"안내 목록\">": "<div class=\"gwrap\"><nav class=\"gmenu\" aria-label=\"Guide list\">", "<div class=\"row between\"><h2>사용 안내<\/h2><button type=\"button\" class=\"btn ghost small\" data-act=\"gdone\">닫기<\/button><\/div>": "<div class=\"row between\"><h2>User guide<\/h2><button type=\"button\" class=\"btn ghost small\" data-act=\"gdone\">Close<\/button><\/div>", "<p class=\"hint\">궁금한 안내를 왼쪽에서 골라 봐.<\/p>": "<p class=\"hint\">Pick the guide you're curious about ion>": "P<\/b><\/div><\/div><div><button type=\"button\" class=\"btn small\" data-act=\"cardmake\">Make a Meomeokjwi photo card<\/button><\/div><\/section>", "<span>내 정보<\/span><\/h2>": "<span>My info<\/span><\/h2>", "<label class=\"label\" for=\"nick\">닉네임<\/label><div class=\"field-row\"><input id=\"nick\" class=\"field\" type=\"text\" maxlength=\"12\" value=\"": "<label class=\"label\" for=\"nick\">Nickname<\/label><div class=\"field-row\"><input id=\"nick\" class=\"field\" type=\"text\" maxlength=\"12\" value=\"", "\" autocomplete=\"off\"><button type=\"button\" class=\"btn small\" data-act=\"nick\">저장<\/button><\/div>": "\" autocomplete=\"off\"><button type=\"button\" class=\"btn small\" data-act=\"nick\">Save<\/button><\/div>", "<p class=\"hint\">게시판 글에 이 닉네임이 보여.<\/p>": "<p class=\"hint\">This nickname shows on your board posts.<\/p>", "<div class=\"label\">나의 최애 음식 Top3<\/div>": "<div class=\"label\">My Top 3 favorite foods<\/div>", "예: 마라탕": "e.g. Malatang", "예: 곱창": "e.g. Gopchang", "예: 치즈케이크": "e.g. Cheesecake", "<div><button type=\"button\" class=\"btn small\" data-act=\"savefav\">최애 저장<\/button><\/div>": "<div><button type=\"button\" class=\"btn small\" data-act=\"savefav\">Save favorites<\/button><\/div>", "<p class=\"hint\">게시판에 올린 글에 닉네임과 함께 보여. 비워 두면 안 보여.<\/p>": "<p class=\"hint\">Shown with your nickname on posts you make on the board. Leave blank to hide.<\/p>", "<div class=\"stat\"><span>정한 메뉴<\/span><b>": "<div class=\"stat\"><span>Menus picked<\/span><b>", "개<\/b><\/div><div class=\"stat\"><span>올린 글<\/span><b>": "<\/b><\/div><div class=\"stat\"><span>Posts<\/span><b>", "개<\/b><\/div><\/section>": "<\/b><\/div><\/section>", "<section class=\"card\"><h2>설정 초기화<\/h2><p class=\"hint\">취향과 고른 메뉴 기록이 지워지고 처음 설정 화면으로 돌아가. 인증한 기록과 포인트는 남아.<\/p>": "<section class=\"card\"><h2>Reset settings<\/h2><p class=\"hint\">Preferences and picked-menu history are erased and you return to the first setup screen. Verified records and points stay.<\/p>", "정말 초기화할게": "Yes, reset it", "처음부터 다시 설정": "Start setup over", "주년": " year anniversary", "일주일": "One week", "한 달": "One month", "아": "", "야": "", "벌써 일주일이야! 처음 만난 날이 엊그제 같은데.": "Already a week! It feels like we met just yesterday.", "한 달이면 습관이 되기 시작하는 시간이래. 우리 사이도 습관이 된 걸까?": "They say a month is when things become a habit. Have we become a habit?", "50일이면 반백일이야. 이쯤 되면 서로 입맛은 거의 다 아는 사이지!": "50 days is half of 100! By now we pretty much know each other's tastes.", "100일에는 케이크를 먹는대. 우리도 맛있는 걸로 축하하자!": "They say you eat cake on day 100. Let's celebrate with something tasty too!", "150일이라니, 이제 메뉴 고르는 눈이 보통이 아니야.": "150 days already, your eye for menus is something else now.", "200일! 메뉴 선택 베테랑이 다 됐네.": "200 days! You've become a veteran at picking menus.", "300일이야. 1주년까지 얼마 안 남았어!": "It's day 300. Not long until our 1-year anniversary!", "벌써 1주년이야! 봄엔 딸기, 여름엔 냉면, 가을엔 전어, 겨울엔 호떡. 사계절을 같이 먹었네.": "Already our 1-year anniversary! Strawberries in spring, naengmyeon in summer, fall's gizzard shad, winter hotteok. We ate through all four seasons together.", "500일이라니, 이쯤이면 전설의 콤비야.": "500 days, that's a legendary duo by now.", "2주년이야! 같이 먹은 끼니를 다 모으면 산이 되겠지?": "Our 2-year anniversary! If we collected every meal we ate together it would be a mountain, right?", "1000일! 이건 거의 전설이야.": "1000 days! This is practically legendary.", "{n} 안녕! 머먹쥐야. 우리가 함께한 지 벌써 {lab}이래. 편지를 쓰려고 연필을 잡았는데 앞발이 떨려…": "Hi {n}! It's me, Meomeokjwi. We've already been together {lab}. I picked up a pencil to write, but my paws are trembling…", "{n}, 오늘 우리 {lab}이야! 달력 보다가 깜짝 놀라서 허겁지겁 편지를 써.": "{n}, today is our {lab}! I looked at the calendar, was startled, and scribbled this letter in a hurry.", "사랑하는 {n}에게. 오늘은 우리가 만난 지 {lab}이 되는 날이야!": "Dear {n}, today marks {lab} since we met!", "{n}, 잘 지내? 오늘은 꼭 말해 주고 싶어서 편지를 써. 우리가 함께한 지 {lab}이 됐어!": "{n}, how are you? I wanted to tell you something today, so I'm writing. It's been {lab} since we got together!", "똑똑! {n}, 머먹쥐 우체부가 왔어요. 오늘은 우리가 만난 지 {lab}이 되는 날이래!": "Knock knock! {n}, Meomeokjwi the mail mouse is here. They say today is {lab} since we met!", "{n}, 이 편지 받고 깜짝 놀랐지? 오늘이 우리 {lab}이거든. 몰래 준비했어!": "{n}, surprised to get this letter? Today is our {lab}. I prepared it in secret!", "꼬르륵 꼬르륵… 아, {n}! 배고파서 정신이 없었는데 오늘이 {lab}인 걸 떠올렸어!": "Growl growl… oh, {n}! I was so hungry I was out of it, but then I remembered today is {lab}!", "{n}에게. 오늘 하루 어땠어? 나는 오늘 우리가 함께한 {lab}을 기념하려고 펜을 들었어.": "To {n}. How was your day? I picked up a pen today to celebrate our {lab} together.", "안녕안녕! 나야 나, 머먹쥐! {n}, 우리 벌써 {lab}이나 됐다니 믿어져?": "Hello hello! It's me, Meomeokjwi! {n}, can you believe it's already been {lab}?", "주년이라니, 시간이 정말 빨라!": " year anniversary, time flies so fast!", "이라니, 시간이 정말 빨라!": ", time flies so fast!", "요즘 공부하랴 학교 가랴 바쁘지? 그래도 밥은 꼭 챙겨 먹어야 해.": "You're busy with studying and school these days, right? Still, you have to eat properly.", "시험 기간엔 달달한 게 당기는 법이지. 머먹쥐는 다 이해해!": "You crave sweet things during exam season. Meomeokjwi understands!", "학교 끝나고 뭐 먹을지 고민하는 게 하루 중 제일 설레는 일 아니야?": "Isn't deciding what to eat after school the most exciting part of the day?", "친구들이랑 떡볶이 먹으러 가는 길이 제일 신나지? 나도 따라가고 싶다!": "The walk to eat tteokbokki with friends is the best, right? I want to tag along!", "졸린 수업 시간엔 점심 메뉴 생각만 해도 힘이 나잖아. 맞지?": "In sleepy class, even just thinking about lunch gives you energy, right?", "하루가 길고 피곤해도 맛있는 간식 하나면 다시 힘이 나는 나이잖아!": "The day is long and tiring, but one tasty snack gives you energy again at your age!", "과제랑 알바, 약속 사이에서 끼니 챙기는 것도 일이지?": "Fitting meals between assignments, part-time jobs and plans is a job in itself, right?", "자취든 본가든 오늘도 한 끼 잘 챙겨 먹고 있길 바랄게.": "Whether you live alone or at home, I hope you're eating a good meal today too.", "바쁜 하루 사이에서도 밥 먹는 시간만은 꼭 지키자!": "Even on busy days, let's protect mealtime!", "친구들이랑 맛집 가는 날이 제일 반짝이는 날이지. 나도 끼워 줘!": "The day you go to a good restaurant with friends is the shiniest day. Take me along!", "하고 싶은 것도 많고 할 일도 많은 요즘, 한 끼만은 나를 위해 쓰자.": "With so much you want to do and so much to do these days, let's spend one meal on yourself.", "편의점 도시락도 좋지만 가끔은 제대로 된 한 끼도 먹어 줘야 해!": "Convenience-store lunch boxes are fine, but sometimes you should eat a proper meal too!", "점심 메뉴 고르는 일이 제일 어려운 업무일 때가 있잖아.": "Sometimes picking lunch is the hardest task, right?", "정신없는 와중에도 한 끼는 맛있게 먹자. 그게 제일 남는 장사야.": "Even when you're swamped, eat one meal well. That's the best deal.", "바쁜 하루 끝에 먹는 저녁 한 끼가 제일 큰 위로일 때가 있어.": "The dinner you eat after a busy day can be the biggest comfort.", "일도 사람도 복잡한 요즘, 메뉴 고르는 건 내가 대신 고민해 줄게!": "With work and people so complicated lately, I'll worry about the menu for you!", "커피로 버티는 날이 많아도 밥은 꼭 챙겨 먹기로 약속하자.": "Even if you get by on coffee a lot, let's promise to eat real meals.", "퇴근길에 \"오늘은 뭐 먹지?\" 하는 그 마음, 내가 제일 잘 알지!": "That feeling of \"what should I eat today?\" on the way home from work, I know it best!", "챙길 게 많은 요즘, 네 밥은 누가 챙기나 싶어서 내가 늘 걱정이야.": "You have so much to take care of these days, I always worry who takes care of your meals.", "이만큼 달려왔으면 오늘 한 끼는 제대로 대접받아도 돼.": "After running this far, you deserve to be treated properly with a meal today.", "바쁜 날일수록 끼니는 거르지 말자. 약속!": "The busier the day, the less we should skip meals. Promise!", "남의 입맛 챙기느라 내 입맛은 뒷전이었던 날, 있지? 오늘은 네 차례야.": "Some days you take care of others' tastes and put yours last, right? Today it's your turn.", "든든한 한 끼가 하루를 버티게 해 주는 나이잖아. 같이 잘 챙기자!": "It's the age when a hearty meal carries you through the day. Let's take good care of it together!", "오래 알고 지낸 맛이 제일 맛있는 법이지만, 가끔 새로운 맛도 도전해 보자!": "The taste you've known a long time is the best, but let's try new flavors sometimes too!", "이만큼 살아온 사람이 고르는 메뉴엔 다 이유가 있는 법이지.": "The menu someone who has lived this long picks always has a reason.", "천천히, 든든하게, 맛있게. 그게 제일이야.": "Slowly, heartily, deliciously. That's the best.", "오늘 한 끼는 느긋하게 즐겨 보자. 서두를 필요 없어!": "Let's enjoy today's meal leisurely. No need to rush!", "맛있는 한 끼에 담긴 추억이 많지? 나도 그 얘기가 듣고 싶어.": "A tasty meal holds many memories, right? I want to hear those stories   function favLine(a) {
    const l = favList(a); if (!l.length) return '';
    return __t('<div class="fav" aria-label="최애 음식 Top3"><span class="favt">최애</span>') + l.map(x => '<span class="favi"><b>' + x[0] + '</b>' + esc(x[1]) + '</span>').join('') + '</div>';
  }
  function saveFav() {
    const v = [0, 1, 2].map(i => { const el = document.getElementById('fav' + i); return el ? el.value : ''; });
    profile.fav = cleanFav(v); saveProfile(); toast(favList(profile.fav).length ? __t('최애 음식을 저장했어') : __t('최애 음식을 비웠어')); render();
  }
  function saveNick() {
    const el = document.getElementById('nick'); if (!el) return;
    const v = el.value.trim().slice(0, 12);
    if (!v) { toast(__t('닉네임을 적어 줘!')); return; }
    profile.nick = v; saveProfile(); toast(__t('닉네임을 바꿨어')); render();
  }

  /* ---------- 그리기 ---------- */
  const $app = document.getElementById('app');
  const $nav = document.getElementById('nav');
  const $toast = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    $toast.textContent = msg; $toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $toast.hidden = true; }, 2400);
  }

  function render() {
    const y = window.scrollY;
    if (ui.tab === 'share') {
      ui.shared = parseShare(location.hash);
      $nav.hidden = true;
      $app.innerHTML = renderShared();
    } else if (!profile.done) {
      $nav.hidden = true;
      $app.innerHTML = renderWizard();
    } else {
      $nav.hidden = false;
      $nav.querySelectorAll('[data-val]').forEach(b => b.setAttribute('aria-current', (b.dataset.val === ui.tab || (b.dataset.val === 'today' && (ui.tab === 'weekend' || ui.tab === 'random'))) ? 'page' : 'false'));
      $app.innerHTML = ui.tab === 'weekend' ? renderWeekend() : (ui.tab === 'my' ? renderMy() : (ui.tab === 'board' ? renderBoard() : (ui.tab === 'mouse' ? renderMouse() : (ui.tab === 'random' ? renderRandom() : (ui.tab === 'calendar' ? renderCalendar() : renderToday())))));
      const inp = document.getElementById('area');
      if (inp) inp.value = profile.area || '';
    }
    window.scrollTo(0, y);
    checkLevelUp();
  }

  /* ---------- 동작 ---------- */
  function applyArea() {
    const inp = document.getElementById('area');
    if (!inp) return;
    profile.area = inp.value.trim().slice(0, 30);
    saveProfile(); render();
    toast(profile.area ? profile.area + __t(' 근처로 검색해') : __t('지역 설정을 지웠어'));
  }

  document.addEventListener('click', e => {
    if (e.target === sheet) { closeSheet(); return; }
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, val = t.dataset.val, field = t.dataset.field;
    if (act !== 'reset') ui.confirmReset = false;
    if (act !== 'wipe') ui.confirmWipe = false;
    if (act !== 'bkrestore') ui.confirmRestore = false;
    if (busy() && act !== 'tab' && act !== 'rstop') return;
    if (!['attend', 'choose', 'shoot', 'sfxtoggle', 'sreplay'].includes(act)) sfx('tap');

    switch (act) {
      case 'tab': location.hash = val; return;
      case 'toggle': {
        const arr = profile[field];
        const i = arr.indexOf(val);
        if (i >= 0) arr.splice(i, 1); else arr.push(val);
        ui.cur = {}; ui.wk = {};
        saveProfile(); break;
      }
      case 'set':
        profile[field] = (field === 'spicy' || field === 'greasy') ? Number(val) : val;
        ui.cur = {}; ui.wk = {};
        saveProfile(); if (ui.aboutOpen && sheet && !sheet.hidden) aboutSheet(); break;
      case 'next': if (ui.step === 0 && !(profile.gender && profile.age)) { toast(__t('성별과 나이대를 꼭 골라 줘')); return; } ui.step = Math.min(ui.step + 1, STEPS.length - 1); window.scrollTo(0, 0); break;
      case 'prev': ui.step = Math.max(ui.step - 1, 0); window.scrollTo(0, 0); break;
      case 'finish':
        if (!(profile.gender && profile.age)) { ui.step = 0; toast(__t('성별과 나이대를 꼭 골라 줘')); break; }
        profile.done = true; saveProfile(); ensureSince();
        ui.meal = currentMeal(); ui.cur = {};
        if (location.hash !== '#today') location.hash = 'today';
        ui.tab = 'today'; window.scrollTo(0, 0);
        toast(__t('좋아, 이제 같이 골라 보자!')); break;
      case 'meal': ui.meal = val; break;
      case 'hang': ui.hangover = !ui.hangover; ui.cur[ui.meal] = 0; break;
      case 'roll': ui.cur[ui.meal] = (ui.cur[ui.meal] || 0) + 1; break;
      case 'pick': ui.cur[ui.meal] = Number(val); window.scrollTo(0, 0); break;
      case 'choose': sfx('pick'); assignPlan(val, todayKey(), ui.meal, false); break;
      case 'clearhist': history = history.filter(h => h.cert); saveHistory(); toast(__t('기록을 비웠어')); break;
      case 'datev': ui.dateV = val; ui.dateN = 0; break;
      case 'datenext': ui.dateN = (ui.dateN || 0) + 1; break;
      case 'wkroll': ui.wk[val] = (ui.wk[val] || 0) + 1; break;
      case 'area': applyArea(); return;
      case 'rgame': Object.assign(ui.rnd, { game: val, how: null, phase: 'setup', result: null, lad: null, startSel: null, rebuilds: 0 }); break;
      case 'rhow':
        Object.assign(ui.rnd, { how: val, phase: 'setup', result: null, lad: null, startSel: null, rebuilds: 0 });
        if (val === 'auto') fillAuto();
        break;
      case 'rback':
        if (ui.rnd.how) ui.rnd.how = null; else ui.rnd.game = null;
        Object.assign(ui.rnd, { phase: 'setup', result: null, lad: null, startSel: null, rebuilds: 0 }); break;
      case 'rmeal': ui.rnd.meal = val; ui.rnd.nonce++; fillAuto(); break;
      case 'refill': ui.rnd.nonce++; fillAuto(); toast(__t('메뉴를 싹 갈아엎었쥐!')); break;
      case 'lrebuild':
        if (ui.rnd.phase === 'setup' && ui.rnd.rebuilds < MAXREBUILD) {
          ui.rnd.rebuilds++; ui.rnd.lad = null; ui.rnd.startSel = null;
          refreshVisual();
          toast(__t('사다리 줄을 새로 그렸쥐! (남은 ') + (MAXREBUILD - ui.rnd.rebuilds) + __t('회)'));
        }
        return;
      case 'rgo': if (ui.rnd.game === 'roulette') startRoulette(); else runLadder(); return;
      case 'rstop': stopRoulette(); return;
      case 'lsel':
        if (ui.rnd.phase === 'setup') { ui.rnd.startSel = ui.rnd.startSel === Number(val) ? null : Number(val); refreshVisual(); }
        return;
      case 'ragain':
        Object.assign(ui.rnd, { phase: 'setup', result: null, startSel: null, rebuilds: 0 });
        if (ui.rnd.game === 'ladder') ui.rnd.lad = null;
        break;
      case 'rreset': cancelAnimationFrame(ui.rnd.raf); ui.rnd = newRnd(); toast(__t('싹 갈아엎었쥐!')); break;
      case 'cagree': agreeConsent(); return;
      case 'cdecline': showConsent(true); return;
      case 'cretry': showConsent(false); return;
      case 'alg': setAllergyConsent(val === 'on'); return;
      case 'wipe': if (!ui.confirmWipe) { ui.confirmWipe = true; break; } wipeAll(); return;
      case 'pblock': {
        const p = ui.posts.find(x => x.id === val);
        if (p && p.u && p.u !== ui.uid && !isBlocked(p.u)) { blocked.push({ u: p.u, k: String(p.k || __t('익명')).slice(0, 12) }); store.set('blocked', blocked); }
        closeSheet(); toast(__t('차단했어. 이 사용자의 글은 보이지 않아')); break;
      }
      case 'punblock': blocked = blocked.filter(b => b.u !== val); store.set('blocked', blocked); toast(__t('차단을 해제했어')); break;
      case 'setlang': if ((val === 'en') !== __EN) __setLang(val); return;
      case 'bkmake': ui.backup = backupCode(); store.set('bkdone', { ts: Date.now(), pts: totalPts() }); break;
      case 'bknot': store.set('bksnooze', Date.now()); closeSheet(); return;
      case 'gobk': closeSheet(); ui.myTab = 'account'; if (location.hash !== '#my') location.hash = 'my'; else render(); return;
      case 'bkcopy': {
        const out = document.getElementById('bkout');
        (navigator.clipboard ? navigator.clipboard.writeText(ui.backup) : Promise.reject()).then(() => toast(__t('백업 코드를 복사했어'))).catch(() => { if (out) { out.focus(); out.select(); } toast(__t('코드를 길게 눌러 복사해 줘')); });
        return;
      }
      case 'bkrestore': {
        const el = document.getElementById('bkin'), o = el && parseBackup(el.value);
        if (!o) { toast(__t('백업 코드가 올바르지 않아')); return; }
        if (!ui.confirmRestore) { ui.confirmRestore = true; t.textContent = __t('정말 덮어쓸게'); toast(__t('한 번 더 누르면 현재 데이터를 덮어써')); return; }
        try { applyBackup(o); } catch (e) { toast(__t('저장 공간이 부족해서 복원하지 못했어')); }
        return;
      }
      case 'bgmtoggle': bgmOn = !bgmOn; store.set('bgm', bgmOn); if (bgmOn) { bgmFails = 0; bgmStart(); } else bgmStop(); render(); setTimeout(bgmLabel, 0); return;
      case 'bgmresume': if (bgmOn) { bgmFails = 0; bgmWant = true; bgmStart(); } return;
      case 'bgmskip': bgmFails = 0; bgmWant = true; bgmNext(); return;
      case 'gsel': ui.guide = Number(val); if (t.dataset.s === '1') showGuide(ui.guide); else render(); return;
      case 'gdone': closeSheet(); return;
      case 'lgok': tryLogin(); return;
      case 'lgforgot': ui.confirmLgWipe = false; loginSheet('', true); return;
      case 'lgback': loginSheet(); return;
      case 'lgwipe': if (!ui.confirmLgWipe) { ui.confirmLgWipe = true; loginSheet('', true); return; } ui.lock = false; wipeAll(); return;
      case 'lkset': lockSet(); return;
      case 'lknow': ui.lock = false; loginSheet(); return;
      case 'lkclear': lockClear(); return;
      case 'abok':
        if (!(profile.gender && profile.age)) { toast(__t('성별과 나이대를 꼭 골라 줘')); return; }
        ui.aboutOpen = false; ui.lock = false; closeSheet(); render(); toast(__t('고마워! 이제 더 잘 골라 줄게'));
        showGuideIfNeeded(); showLetterIfNeeded(); showAttWelcome(); return;
      case 'letter': showLetter(val); return;
      case 'letterprev': ui.prevN = (ui.prevN || 0) + 1; showLetter('', makeLetter(100, 'p' + ui.prevN)); return;
      case 'goletters': closeSheet(); ui.mouseTab = 'diary'; if (location.hash !== '#mouse') location.hash = 'mouse'; else render(); return;
      case 'pwainstall': if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); } return;
      case 'ppick': { const el = document.getElementById('pimgin'); if (el) el.click(); return; }
      case 'pimgdel': ui.pimg = null; { const b = document.getElementById('pprev'); if (b) b.innerHTML = ''; } return;
      case 'sfxtoggle': sfxOn = !sfxOn; store.set('sfx', sfxOn); sfx('ok'); render(); return;
      case 'attend': attend(); return;
      case 'story': { const lv = parseInt(val, 10); if (lv >= 1 && lv <= LEVELS.length && lv <= meLv().lv) openStory(lv, false); return; }
      case 'sreplay': { const s = ui.story; if (s && s.done) { cancelAnimationFrame(s.raf); playStory(s, true); } return; }
      case 'sshare': shareStory(); return;
      case 'sskip': { const s = ui.story; if (s && !s.done) { s.skipped = true; s.skipT = ST_DUR; } return; }
      case 'adopen': showAdSheet(); return;
      case 'adclaim': claimAd(); return;
      case 'goatt': closeSheet(); if (location.hash !== '#' + val) location.hash = val; else render(); return;
      case 'bnew': showPostSheet(); return;
      case 'prep': showReportSheet(val); return;
      case 'preport': submitReport(val, Number(t.dataset.r)); return;
      case 'pfill': { const el = document.getElementById('pn'); if (el) { el.value = val; el.focus(); } return; }
      case 'ppost': submitPost(); return;
      case 'like': toggleLike(val); return;
      case 'pdel': deletePost(val); return;
      case 'bsort': ui.bsort = val; break;
      case 'mytab': ui.myTab = val; if (ui.tab !== 'my') { location.hash = 'my'; return; } break;
      case 'nick': saveNick(); return;
      case 'savefav': saveFav(); return;
      case 'favadd': addFav(val); return;
      case 'favrep': { const f = cleanFav(profile.fav), k = Number(val); if (ui.favPick && k >= 0 && k < 3) { f[k] = ui.favPick; profile.fav = f; saveProfile(); closeSheet(); toast(__t('내 최애 ') + (k + 1) + __t('위를 바꿨어')); render(); } return; }
      case 'plan': assignPlan(val, t.dataset.d, t.dataset.m, t.dataset.h === '1'); break;
      case 'share': openShare(val, t.dataset.l, t.dataset.d); return;
      case 'sharimg': shareImage(); return;
      case 'sharelink': shareLink(); return;
      case 'sharecopy': copyLink(); return;
      case 'sclose': closeSheet(); if (!ui.nudged) { ui.nudged = 1; setTimeout(showBackupNudge, 300); } return;
      case 'cam': openCam(t.dataset.d, t.dataset.m); return;
      case 'shoot': shoot(); return;
      case 'retake': startCam(); return;
      case 'usecam': useShot(); return;
      case 'cday': ui.cal.sel = val; break;
      case 'offday': toggleOffDay(val); return;
      case 'mouset': if (val === 'clothes' || val === 'acc' || val === 'furn') { ui.mouseTab = 'shop'; ui.shopTab = val; } else ui.mouseTab = val; break;
      case 'buyroom': buyRoom(val); return;
      case 'roomset': roomSet(t.dataset.slot, val); return;
      case 'cardmake': openMouseCard(); return;
      case 'cardshare': shareMouseCard(); return;
      case 'feed': feedMouse(val); return;
      case 'buy': buyItem(val); return;
      case 'wear': wearItem(val); return;
      case 'offwd': { const n = Number(val); offCfg.wd = offCfg.wd.includes(n) ? offCfg.wd.filter(x => x !== n) : offCfg.wd.concat(n).sort(); saveOff(); render(); return; }
      case 'offreset': offCfg.add = []; offCfg.rm = []; saveOff(); toast(__t('날짜별 설정을 지웠어')); render(); return;
      case 'cprev': case 'cnext': {
        const d = new Date(ui.cal.y, ui.cal.m + (act === 'cnext' ? 1 : -1), 1);
        ui.cal.y = d.getFullYear(); ui.cal.m = d.getMonth();
        ui.cal.sel = (d.getFullYear() === new Date().getFullYear() && d.getMonth() === new Date().getMonth()) ? todayKey() : dayKey(d);
        break;
      }
      case 'reset':
        if (!ui.confirmReset) { ui.confirmReset = true; break; }
        profile = Object.assign({}, DEFAULT, { cuisines: [], kinds: [], dislikes: [], allergens: [], nick: profile.nick, gender: profile.gender, age: profile.age });
        history = history.filter(h => h.cert); saveProfile(); saveHistory();
        ui.step = 0; ui.confirmReset = false; ui.cur = {}; ui.wk = {};
        window.scrollTo(0, 0); break;
    }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet();
    if (e.key === 'Enter' && e.target && e.target.id === 'lgin') { e.preventDefault(); tryLogin(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'nick') { e.preventDefault(); saveNick(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'pt') { e.preventDefault(); submitPost(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'area') { e.preventDefault(); applyArea(); }
    if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('minput')) {
      e.preventDefault();
      const next = document.querySelector('.minput[data-i="' + (Number(e.target.dataset.i) + 1) + '"]');
      if (next) next.focus(); else e.target.blur();
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.dataset && e.target.dataset.act === 'lsel') {
      e.preventDefault();
      if (ui.rnd.phase === 'setup') { const v = Number(e.target.dataset.val); ui.rnd.startSel = ui.rnd.startSel === v ? null : v; refreshVisual(); }
    }
  });

  // 수동 입력: 입력할 때마다 룰렛/사다리를 바로 다시 그림 (입력칸은 그대로 둬서 커서가 안 사라짐)
  document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('cchk')) syncConsent(e.target); });
  document.addEventListener('input', e => {
    const t = e.target;
    if (!t.classList || !t.classList.contains('minput')) return;
    const r = ui.rnd;
    r.manual[Number(t.dataset.i)] = t.value;
    if (r.phase === 'done') { r.phase = 'setup'; r.result = null; const res = document.getElementById('result'); if (res) res.remove(); }
    refreshVisual();
  });

  window.addEventListener('hashchange', () => {
    ui.tab = tabFromHash();
    ui.confirmReset = false;
    if (!sheet.hidden) closeSheet();
    render();
    window.scrollTo(0, 0);
  });

  render();
  initBoard();
  loadPhotos();
  // 로딩 화면: 짧게 보여 주고 부드럽게 사라져
  (function () {
    const sp = document.getElementById('splash');
    if (!sp) return;
    const t0 = Date.now(), ready = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]) : Promise.resolve();
    const enter = () => { sp.classList.add('out'); setTimeout(() => { sp.remove(); if (getLock()) { loginSheet(); return; } showConsent(); showAboutIfNeeded(); showGuideIfNeeded(); showLetterIfNeeded(); showAttWelcome(); showBackupNudge(); }, 450); };
    ready.then(() => setTimeout(() => {
      if (ui.tab === 'share') { enter(); return; }
      // 로딩이 끝나면 '시작하기' 버튼을 보여 줘 (이 버튼을 누르는 순간 배경 음악도 시작돼)
      sp.classList.add('wait'); sp.setAttribute('aria-label', __t('오머먹 시작 화면'));
      const sub = sp.querySelector('.ssub'); if (sub) sub.textContent = __t('오늘 뭐 먹지? 머먹쥐랑 같이 골라 봐!');
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn primary startbtn'; btn.textContent = __t('오머먹 시작하기');
      btn.addEventListener('click', () => { btn.disabled = true; bgmStart(); sfx('pick'); enter(); });
      sp.appendChild(btn);
      if (bgmOn) {
        const q = document.createElement('button'); q.type = 'button'; q.className = 'btn ghost quietbtn'; q.textContent = __t('소리 없이 시작하기');
        q.addEventListener('click', () => { q.disabled = true; btn.disabled = true; bgmOn = false; store.set('bgm', false); enter(); });
        sp.appendChild(q);
      }
      const lb = document.createElement('button'); lb.type = 'button'; lb.className = 'btn ghost langbtn'; lb.textContent = __EN ? __t('한국어로 시작하기') : 'Start in English'; lb.lang = __EN ? 'ko' : 'en';
      lb.addEventListener('click', () => { __setLang(__EN ? 'ko' : 'en'); });
      sp.appendChild(lb);
      try { btn.focus({ preventScroll: true }); } catch (e) {}
    }, Math.max(0, 1000 - (Date.now() - t0))));
  })();
})();

</script>

<script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
