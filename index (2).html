<title>오머먹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 점무늬 배경 위에 말랑한 스티커 카드를 올린 모바일 앱. 하단 탭 3개, 한가운데 큼직한 메뉴 스티커 하나가 주인공. */
:root {
  --bg: #EAF5EE;
  --dot: #D1E6D8;
  --surface: #FFFFFF;
  --ink: #22302A;
  --muted: #5A6B61;
  --edge: #C9DFD0;
  --edge-shadow: #B5D0BE;
  --accent: #1D7A55;
  --accent-deep: #135A3E;
  --accent-ink: #FFFFFF;
  --tint: #DDF0E4;
  --pop: #FFC83D;
  --pop-ink: #3A2A00;
  --pink: #FF8FA3;
  --hot: #E8573F;
  --oil: #F5A623;
  --font-display: 'Jua', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1713; --dot: #17231C; --surface: #18221C; --ink: #E9F1EB; --muted: #9BAFA2;
    --edge: #2B3D32; --edge-shadow: #0A100D; --accent: #4FC08D; --accent-deep: #2E8F66; --accent-ink: #07140D;
    --tint: #20332A; --hot: #FF7A63; --oil: #FFB547;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1713; --dot: #17231C; --surface: #18221C; --ink: #E9F1EB; --muted: #9BAFA2;
  --edge: #2B3D32; --edge-shadow: #0A100D; --accent: #4FC08D; --accent-deep: #2E8F66; --accent-ink: #07140D;
  --tint: #20332A; --hot: #FF7A63; --oil: #FFB547;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.7px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  word-break: keep-all; overflow-wrap: break-word;
  padding-block: 18px 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 23px; text-wrap: balance; line-height: 1.25; }
h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 27px; letter-spacing: .01em; }
.date { color: var(--muted); font-size: 13px; background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 12px; }
.muted, .hint { color: var(--muted); font-size: 13px; }
.label { font-size: 13px; color: var(--muted); font-weight: 700; }

.card { background: var(--surface); border: 2px solid var(--edge); border-radius: 26px; box-shadow: 0 5px 0 var(--edge-shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.h-ico { display: flex; align-items: center; gap: 10px; }

/* 스티커 타일 */
.tile { --s: 72px; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .34); background: var(--tile, var(--tint)); display: grid; place-items: center; flex: none; box-shadow: 0 3px 0 rgba(74, 52, 40, .14); }
.tile .fi { width: 80%; height: 80%; }
.tile.lg { --s: 124px; transform: rotate(-4deg); animation: pop .4s ease-out; box-shadow: 0 6px 0 rgba(74, 52, 40, .16); }
.tile.md { --s: 66px; }
.tile.sm { --s: 50px; border-radius: 16px; }
.tile.xs { --s: 36px; border-radius: 12px; box-shadow: 0 2px 0 rgba(74, 52, 40, .14); }
.fi { display: block; width: 100%; height: 100%; }
.mi { width: 24px; height: 24px; border-radius: 50%; background: #fff; display: inline-grid; place-items: center; flex: none; }
.mi .fi { width: 20px; height: 20px; }
.gl { width: 22px; height: 22px; display: block; flex: none; }
@keyframes pop { 0% { transform: scale(.8) rotate(-12deg); } 60% { transform: scale(1.07) rotate(-2deg); } 100% { transform: scale(1) rotate(-4deg); } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; padding: 6px 14px 6px 8px; border-radius: 999px; border: 2px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; transition: background .15s, color .15s, transform .1s; min-height: 40px; }
.chip:not(:has(.mi)) { padding-left: 14px; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-deep); color: var(--accent-ink); font-weight: 700; }
.chip.small { font-size: 13px; padding: 4px 12px; min-height: 38px; }
.chip.static { cursor: default; background: var(--tint); border-color: transparent; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border: 2px solid var(--edge); border-radius: 18px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 6px; border-radius: 14px; cursor: pointer; font-weight: 500; font-size: 13px; line-height: 1.3; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 3px 0 var(--accent-deep); }
.seg.big button { font-size: 16px; font-family: var(--font-display); font-weight: 400; }

.btn { font-weight: 700; font-size: 15px; border-radius: 18px; padding: 12px 18px; border: 2px solid var(--edge); background: var(--surface); color: var(--ink); cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; box-shadow: 0 4px 0 var(--edge-shadow); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-shadow); }
.btn.primary { background: var(--accent); border-color: var(--accent-deep); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep); }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-deep); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:active { transform: none; }
.btn.small { min-height: 42px; padding: 8px 14px; font-size: 14px; border-radius: 14px; box-shadow: 0 3px 0 var(--edge-shadow); }
.btn.ghost.small { box-shadow: none; }
.btn.danger { color: var(--hot); border-color: var(--hot); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; }

.progress { height: 10px; background: var(--surface); border: 2px solid var(--edge); border-radius: 10px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 10px; transition: width .25s; }
.step-count { font-size: 13px; color: var(--muted); }

/* 오늘의 메뉴 카드 */
.hero { align-items: center; text-align: center; gap: 10px; padding-top: 18px; }
.hero > * { max-width: 100%; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 700; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.stage { position: relative; width: 100%; display: grid; place-items: center; padding: 8px 0 4px; }
.spark { position: absolute; width: 20px; height: 20px; color: var(--pop); }
.spark.a { top: 10px; left: calc(50% - 88px); }
.spark.b { bottom: 14px; right: calc(50% - 92px); width: 14px; height: 14px; color: var(--pink); }
.spark.c { top: 34px; right: calc(50% - 84px); width: 11px; height: 11px; color: var(--accent); }
.dish { font-size: 36px; line-height: 1.15; }
.desc { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.ind { display: inline-flex; gap: 1px; }
.ind .gl { width: 16px; height: 16px; }
.ind.hot { color: var(--hot); }
.ind.oil { color: var(--oil); }
.ind .off { opacity: .22; }
.why { display: flex; flex-wrap: wrap; gap: 6px; }
.hero .why { justify-content: center; }
.why span { font-size: 12px; background: var(--tint); padding: 3px 11px; border-radius: 999px; }
.badge { background: var(--pop); color: var(--pop-ink); font-size: 12px; font-weight: 700; padding: 3px 11px; border-radius: 999px; }
.note { font-size: 12px; color: var(--muted); }
.hero .row { width: 100%; margin-top: 4px; }

.alts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.alts button { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border: 2px solid var(--edge); border-radius: 20px; background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--edge-shadow); }
.alts button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge-shadow); }
.alts .t { display: flex; flex-direction: column; min-width: 0; }
.alts .n { font-family: var(--font-display); font-size: 19px; line-height: 1.25; }
.alts .s { font-size: 12px; color: var(--muted); }

.field-row { display: flex; gap: 8px; }
.field { font-family: inherit; font-size: 16px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--edge); background: var(--bg); color: var(--ink); min-width: 0; flex: 1; }

.day-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.slot { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.slot + .slot { border-top: 2px dashed var(--edge); padding-top: 16px; }
.slot .body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot .meal { font-size: 12px; font-weight: 700; color: var(--accent); }
.slot .name { font-family: var(--font-display); font-size: 23px; line-height: 1.2; }
.slot .meta { justify-content: flex-start; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }

#nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--edge); border-radius: 24px 24px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
#nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
#nav button { border: 0; background: transparent; color: var(--muted); padding: 7px 2px; border-radius: 18px; cursor: pointer; font-weight: 500; font-size: 10.5px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; }
#nav button .gl { width: 24px; height: 24px; }
#nav button[aria-current="page"] { color: var(--accent); background: var(--tint); font-weight: 700; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 9; max-width: calc(100% - 32px); text-align: center; }

/* 머먹쥐 */
.say { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.mouse { width: 76px; height: 76px; flex: none; display: block; animation: bob 2.8s ease-in-out infinite; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--edge); border-radius: 20px; padding: 10px 15px; font-family: var(--font-display); font-size: 18px; line-height: 1.35; box-shadow: 0 3px 0 var(--edge-shadow); text-wrap: balance; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 50%; width: 12px; height: 12px; background: var(--surface); border-left: 2px solid var(--edge); border-bottom: 2px solid var(--edge); transform: translateY(-50%) rotate(45deg); }
.hero .bubble { background: var(--tint); box-shadow: none; }
.hero .bubble::before { background: var(--tint); }
.bname { display: flex; flex-direction: column; line-height: 1.1; }
.bname small { font-family: var(--font-body); font-size: 11px; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
.tile.xs .fi { width: 92%; height: 92%; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* 랜덤 뽑기 */
.wheel { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 5px 0 rgba(74, 52, 40, .15)); }
.wheel .wl { font-family: var(--font-display); }
.lad { width: 100%; height: auto; display: block; margin: 0 auto; }
.lad .ln { stroke: var(--muted); stroke-width: 3; stroke-linecap: round; opacity: .55; }
.lad .lp { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.lad .tok { cursor: pointer; }
.lad .tok:focus-visible { outline: none; }
.lad .tok:focus-visible circle { stroke: var(--accent); stroke-width: 5; }
.lad .slot-b { fill: var(--surface); stroke: var(--edge); stroke-width: 2; }
.lad .q { font-family: var(--font-display); font-size: 24px; fill: var(--muted); }
.lad .sl { font-family: var(--font-body); font-size: 10px; fill: var(--ink); }
.lad .slot-b.win { stroke: var(--accent); stroke-width: 4; }
.askbox { width: 100%; background: var(--tint); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.askrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.askrow .dl { font-size: 13px; font-weight: 700; min-width: 104px; }
.hero .row { width: 100%; }
.hero .row > .btn { flex: 1 1 130px; }
.between { justify-content: space-between; align-items: center; flex-wrap: nowrap; }

/* 캘린더 */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; padding-bottom: 2px; }
.dow.red { color: var(--hot); }
.cd { position: relative; aspect-ratio: 1 / 1.2; border: 2px solid transparent; border-radius: 14px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 3px 0 0; gap: 1px; cursor: pointer; color: var(--ink); min-width: 0; }
.cd.empty { visibility: hidden; cursor: default; }
.cd .dn { font-size: 11.5px; font-weight: 700; line-height: 1.2; }
.cd.red .dn { color: var(--hot); }
.cd .fi { width: 74%; max-width: 32px; height: auto; display: block; }
.cd.today { border-color: var(--accent); }
.cd.sel { background: var(--tint); border-color: var(--accent-deep); }
.cd .ck { position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 9px; line-height: 14px; text-align: center; font-weight: 700; }

.photo { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; border: 2px solid var(--edge); flex: none; }

/* 바텀시트 (카메라 · 공유) */
.sheet { position: fixed; inset: 0; background: rgba(20, 30, 24, .55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet .panel { background: var(--surface); border: 2px solid var(--edge); border-bottom: 0; border-radius: 26px 26px 0 0; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.cam video, .cam img { width: 100%; border-radius: 18px; background: #000; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.sharepic { width: 100%; max-width: 360px; margin: 0 auto; border-radius: 18px; border: 2px solid var(--edge); display: block; height: auto; }
.urlbox { width: 100%; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }

.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pick { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px 16px; border: 2px solid var(--edge); border-radius: 26px; background: var(--surface); box-shadow: 0 5px 0 var(--edge-shadow); cursor: pointer; color: var(--ink); text-align: center; transition: transform .08s, box-shadow .08s; }

.crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inrow { display: flex; align-items: center; gap: 10px; }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.go { width: 100%; font-size: 17px; }
.field:disabled { opacity: .6; }

/* 로딩 화면 */
.splash { position: fixed; inset: 0; z-index: 50; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.4px, transparent 1.7px); background-size: 22px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: opacity .35s ease; animation: splashOut .4s ease 2.6s forwards; }

.splash .fl { display: flex; gap: 10px; margin-top: 6px; }
.splash .fl .tile { width: 44px; height: 44px; border-radius: 15px; animation: hop .5s ease-in-out infinite alternate; }
.splash .fl .tile:nth-child(2) { animation-delay: .17s; }
.splash .fl .tile:nth-child(3) { animation-delay: .34s; }
.splash .fl .fi { width: 84%; height: 84%; }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-12px); } }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }

/* 게시판 · 마이페이지 */

.crow.all { font-weight: 700; padding-bottom: 8px; border-bottom: 2px dashed var(--edge); }

.op { background: var(--tint); color: var(--ink); }
details.doc { border: 2px solid var(--edge); border-radius: 16px; padding: 4px 14px; background: var(--bg); }

  /* 공휴일: 날짜가 정해진 국경일·공휴일은 해마다 계산하고(주말과 겹치면 대체공휴일),

     LUNAR_HOLIDAYS는 공개 달력 자료를 바탕으로 한 값이라 해마다 정부 발표와 대조해 갱신하세요. */
  const LUNAR_HOLIDAYS = {
    2026: [['05-24', '부처님오신날'], ['09-24', '추석 연휴'], ['09-25', '추석'], ['09-26', '추석 연휴']],
    2027: [['02-06', '설 연휴'], ['02-07', '설날'], ['02-08', '설 연휴'], ['05-13', '부처님오신날'], ['09-14', '추석 연휴'], ['09-15', '추석'], ['09-16', '추석 연휴']],
    2028: [['01-26', '설 연휴'], ['01-27', '설날'], ['01-28', '설 연휴'], ['05-02', '부처님오신날'], ['10-02', '추석 연휴'], ['10-03', '추석'], ['10-04', '추석 연휴']]
  };
  const FIXED_HOLIDAYS = [['01-01', '신정', false], ['03-01', '3·1절', true], ['05-05', '어린이날', true], ['06-06', '현충일', false], ['08-15', '광복절', true], ['10-03', '개천절', true], ['10-09', '한글날', true], ['12-25', '성탄절', true]];
  function holidaysOfYear(y) {
    const map = {}, key = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const lunar = LUNAR_HOLIDAYS[y] || [];
    lunar.forEach(([md, n]) => { map[y + '-' + md] = n; });
    const subs = [];
    FIXED_HOLIDAYS.forEach(([md, n, sub]) => {
      const k = y + '-' + md, d = new Date(y, +md.slice(0, 2) - 1, +md.slice(3));
      const clash = !!map[k];
      map[k] = clash ? map[k] + '·' + n : n;
      if (sub && (d.getDay() === 0 || d.getDay() === 6 || clash)) subs.push([d, n]);
    });
    // 설날·추석 연휴가 일요일과 겹치면 하루 대체
    [['설', '설 연휴'], ['추석', '추석 연휴']].forEach(([tag]) => {
      const days = lunar.filter(x => x[1].indexOf(tag) === 0).map(x => new Date(y + '-' + x[0] + 'T00:00:00'));
      if (days.some(d => d.getDay() === 0)) subs.push([days[days.length - 1], tag === '설' ? '설날' : '추석']);
    });
    subs.sort((a, b) => a[0] - b[0]).forEach(([d, n]) => {
      const x = new Date(d);
      do { x.setDate(x.getDate() + 1); } while (x.getDay() === 0 || x.getDay() === 6 || map[key(x)]);
      map[key(x)] = '대체공휴일(' + n + ')';
    });
    return map;
  }

  function hash01(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 10000) / 10000;

  // 1단계: 알러지·싫어하는 재료·못 먹는 맵기는 무조건 제외
  function eligible(x) {
    if (x.al.some(a => profile.allergens.includes(a))) return false;
    if (x.tags.some(t => profile.dislikes.includes(t))) return false;
    if (profile.spicy === 0 && x.sp >= 2) return false;
    if (profile.spicy === 1 && x.sp >= 3) return false;
    return true;

  // 2단계: 취향 점수
  function score(x, meal, o) {
    let s = 50;
    if (profile.cuisines.includes(x.cui)) s += 14;
    s += x.kinds.filter(k => profile.kinds.includes(k)).length * 8;

    if (x.sp > profile.spicy) s -= (x.sp - profile.spicy) * 16;
    else if (profile.spicy === 3 && x.sp === 3) s += 12;
    else if (profile.spicy >= 2 && x.sp >= 2) s += 6;

    s += (x.gr - 1.5) * (profile.greasy - 1) * 10;
    if (profile.greasy === 0 && x.gr === 3) s -= 12;

    if (x.a && (meal === 'l' || meal === 'd')) {
      const bonus = profile.drink === 'love' ? 16 : (profile.drink === 'some' ? 6 : 0);
      s += (meal === 'd' ? bonus : bonus / 3) + (o.weekend && meal === 'd' && profile.drink !== 'no' ? 4 : 0);
    }
    if (o.hangover && x.h) s += 30;
    if (o.hangover && x.gr === 3) s -= 10;
    if (meal === 'b') s -= x.gr * 3;

    // 3단계: 최근에 고른 메뉴는 감점
    const last = history.filter(h => h.n === x.n && h.date < todayKey()).map(h => h.ts).sort().pop();
    if (last) {
      const days = (Date.now() - last) / 864e5;
      if (days < 3) s -= 45; else if (days < 7) s -= 22; else if (days < 14) s -= 8;
    }
    return s + hash01(o.seed + x.n) * 20;
  }

  function rank(meal, o) {
    o = o || {};

    for (const x of MENUS) {
      if (!x.meals.includes(meal)) continue;
      if (o.weekend && !x.o) continue;
      if (o.exclude && o.exclude.includes(x.n)) continue;
      if (!eligible(x)) continue;
      out.push({ x, s: score(x, meal, o) });
    }
    out.sort((a, b) => b.s - a.s);
    return out.slice(0, 14).map(r => r.x);
  }

    if (x.sp >= 2 && profile.spicy >= 2) r.push('매운맛 OK');
    if (x.gr === 0 && profile.greasy === 0) r.push('담백해요');
    if (!r.length) r.push('무난한 선택');
    return r.slice(0, 3);

    for (const d = new Date(today); d <= end; d.setDate(d.getDate() + 1)) {
      if (d.getDay() === 0 || d.getDay() === 6 || HOLIDAYS[dayKey(d)]) add(d);
    }
    if (!out.length) {
      for (const d = new Date(today); out.length === 0; d.setDate(d.getDate() + 1)) {
        if (d.getDay() === 0 || d.getDay() === 6 || HOLIDAYS[dayKey(d)]) add(d);

  const allergyNote = () => profile.allergens.length

    : '<p class="note">재료 정보는 일반적인 조리법 기준의 참고용이에요.</p>';
  const head = (k, title) => '<h2 class="h-ico">' + tileK(k, 'xs') + '<span>' + title + '</span></h2>';

  const SAY_MORE = ['이건 어떻쥐?', '요것도 맛있겠쥐!', '이번엔 이거쥐!', '이것도 좋겠쥐?', '이거 한번 먹어 볼까?'];

  /* ---------- 취향 입력 섹션 (온보딩과 내 취향 화면이 함께 씀) ---------- */

    return head('egg', '알러지') + '<p class="hint">해당 성분이 든 메뉴는 절대 추천하지 않아요.</p>' +
      '<div class="chips">' + ALLERGENS.map(a => chip('allergens', a, ALLERGEN_LABEL[a] || a, profile.allergens.includes(a))).join('') + '</div>' +
      '<p class="note">알러지 정보는 일반적인 조리법 기준의 참고용이에요. 식당마다 재료가 다르니 주문 전에 꼭 확인하세요.</p>';
  }
  const STEPS = [secFood, secTaste, secDislike, secAllergy];

  /* ---------- 화면 ---------- */
  function renderWizard() {
    const last = ui.step === STEPS.length - 1;
    return '<header class="top">' + brand('오머먹', '오늘 뭐 먹지?') + '</header>' +
      say(WIZ_MOOD[ui.step], WIZ_SAY[ui.step]) +
      '<p class="hint">몇 가지만 알려 주세요. 나중에 \'내 취향\'에서 바꿀 수 있어요.</p>' +
      '<div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="' + STEPS.length + '" aria-valuenow="' + (ui.step + 1) + '"><span style="width:' + ((ui.step + 1) / STEPS.length * 100) + '%"></span></div>' +
      '<p class="step-count">' + (ui.step + 1) + ' / ' + STEPS.length + '</p>' +
      '<section class="card">' + STEPS[ui.step]() + '</section>' +
      '<div class="row">' + (ui.step > 0 ? '<button type="button" class="btn ghost" data-act="prev">이전</button>' : '') +

  function renderToday() {
    const meal = ui.meal;
    const pool = rank(meal, { seed: todayKey() + meal + (ui.hangover ? 'h' : ''), hangover: ui.hangover });
    const L = meLv();
    let html = '<header class="top">' + brand('오머먹', '오늘 뭐 먹지?') + '<div class="date">' + fmtDate(new Date()) + '</div></header>' +
      '<button type="button" class="mebar" data-act="mytab" data-val="info" aria-label="내 레벨 보기"><span class="lvb">Lv.' + L.lv + '</span><span class="who">' + nameTag(L.lv, profile.nick) + '</span><span class="mini" aria-hidden="true"><span style="width:' + L.pct + '%"></span></span></button>' +
      '<div class="seg big" role="group" aria-label="끼니">' + MEALS.map(k => '<button type="button" data-act="meal" data-val="' + k + '" aria-pressed="' + (ui.meal === k) + '">' + gl(MEAL_GLYPH[k]) + MEAL_NAME[k] + '</button>').join('') + '</div>';

    if (profile.drink !== 'no' && (meal === 'b' || meal === 'l')) {
      html += '<div class="chips"><button type="button" class="chip small" data-act="hang" aria-pressed="' + ui.hangover + '">어제 한잔했어요</button></div>';
    }

    if (!pool.length) {
      return html + '<section class="card hero">' + say('sad', '앗, 맞는 메뉴가 없어… 조건을 조금만 줄여 줄래?') + '<p class="desc">알러지나 싫어하는 재료, 맵기 조건이 많아서 후보가 모두 빠졌어요.</p><button type="button" class="btn primary" data-act="mytab" data-val="pref">내 취향 바꾸기</button></section>';
    }

    const cur = (ui.cur[meal] || 0) % pool.length;
    const x = pool[cur];
    const chosen = history.find(h => h.date === todayKey() && h.meal === meal);
    const isChosen = chosen && chosen.n === x.n;
    const pickLabel = isChosen ? '선택 취소' : (chosen ? '이걸로 바꿀래요' : '이걸로 먹을게요');

    html += '<section class="card hero" aria-live="polite">' +
      say(isChosen ? 'happy' : 'smile', mouseSay(meal, cur, isChosen)) +
      '<div class="stage">' + gl('star', 'spark a') + gl('star', 'spark b') + gl('star', 'spark c') + tile(x, 'lg') + '</div>' +
      '<h2 class="dish">' + x.n + '</h2>' +
      (isChosen ? '<span class="badge">오늘 ' + MEAL_NAME[meal] + ' 메뉴로 정했어요</span>' : '') +
      '<p class="desc">' + x.desc + '</p>' + meta(x) +
      '<div class="why">' + reasons(x, meal).map(r => '<span>' + esc(r) + '</span>').join('') + '</div>' +
      '<div class="row"><button type="button" class="btn primary grow" data-act="choose" data-val="' + esc(x.n) + '">' + pickLabel + '</button>' +
      '<button type="button" class="btn grow" data-act="roll">다른 거 보기</button></div>' +
      '<div class="row"><button type="button" class="btn small ghost grow" data-act="share" data-val="' + esc(x.n) + '" data-l="' + (isChosen ? '오늘 ' + MEAL_NAME[meal] + ' 메뉴' : '머먹쥐의 추천') + '" data-d="' + todayKey() + '">공유하기</button>' +
      '<button type="button" class="btn small ghost grow" data-act="tab" data-val="calendar">캘린더 보기</button></div>' +
      allergyNote() + '</section>';

    const alts = [1, 2].map(i => (cur + i) % pool.length).filter((i, idx, a) => i !== cur && a.indexOf(i) === idx);
    if (alts.length) {
      html += '<h3>이런 메뉴도 있어요</h3><ul class="alts">' + alts.map(i => {
        const y = pool[i];
        return '<li><button type="button" data-act="pick" data-val="' + i + '">' + tile(y, 'sm') + '<span class="t"><span class="n">' + y.n + '</span><span class="s">' + SPICE_TXT[y.sp] + ' · ' + GREASE_TXT[y.gr] + '</span></span></button></li>';
      }).join('') + '</ul>';
    }

    if (history.length) {
      const recent = history.slice(-6).reverse();
      html += '<h3>최근에 고른 메뉴</h3><div class="chips">' + recent.map(h => '<span class="chip small static">' + esc(h.n) + '</span>').join('') + '</div>' +
        '<p class="note">어제까지 고른 메뉴는 며칠 동안 덜 추천해요.</p>' +
        '<div><button type="button" class="btn ghost small" data-act="mytab" data-val="log">전체 기록 보기</button></div>';
    }
    return html;
  }

  function mapLinks(x) {
    const q = (profile.area ? profile.area + ' ' : '') + x.n + ' 맛집';
    return '<div class="links"><a class="btn small" target="_blank" rel="noopener noreferrer" href="https://map.naver.com/p/search/' + encodeURIComponent(q) + '">' + gl('pin') + '네이버지도</a>' +
      '<a class="btn small" target="_blank" rel="noopener noreferrer" href="https://map.kakao.com/?q=' + encodeURIComponent(q) + '">' + gl('pin') + '카카오맵</a></div>';
  }

  function renderWeekend() {
    const days = weekendDays();
    const used = [];
    let html = '<header class="top">' + brand('휴일 외식') + '<div class="date">이번 주 쉬는 날</div></header>' +
      say('think', '이번 휴일엔 뭘 먹으러 갈까?') +
      '<section class="card"><label for="area" class="label">어디서 드실 건가요?</label>' +
      '<div class="field-row"><input id="area" class="field" type="text" maxlength="30" placeholder="예: 홍대입구, 성수동, 판교" autocomplete="off">' +
      '<button type="button" class="btn small" data-act="area">적용</button></div>' +
      '<p class="hint">동네를 넣으면 그 근처 식당으로 지도 검색을 열어 줘요.</p></section>';

    for (const day of days) {
      const slots = ['l', 'd'].map(sl => {
        const ck = day.k + sl;
        const pool = rank(sl, { weekend: true, seed: ck, exclude: used.slice() });
        const plan = entryOf(day.k, sl), px = plan && MENUS.find(m => m.n === plan.n);
        if (!pool.length && !px) return '<div class="slot"><p class="desc">' + MEAL_NAME[sl] + ' 후보가 없어요. 내 취향에서 조건을 줄여 보세요.</p></div>';
        const x = px || pool[(ui.wk[ck] || 0) % pool.length];
        used.push(x.n);
        const on = !!(plan && plan.n === x.n);
        const pr = profile.drink !== 'no' ? pairing(x) : '';
        return '<div class="slot">' + tile(x, 'md') + '<div class="body">' +
          '<div class="meal">' + MEAL_NAME[sl] + '</div><div class="name">' + x.n + '</div>' +
          '<p class="desc">' + x.desc + '</p>' + meta(x) +
          '<div class="why">' + reasons(x, sl).map(r => '<span>' + esc(r) + '</span>').join('') + (pr ? '<span>곁들이면 ' + pr + '</span>' : '') + '</div>' +
          mapLinks(x) +
          '<div class="links"><button type="button" class="btn small ' + (on ? '' : 'primary') + '" data-act="plan" data-val="' + esc(x.n) + '" data-d="' + day.k + '" data-m="' + sl + '" data-h="1">' + (on ? '휴일 메뉴 취소' : '이 메뉴로 정하기') + '</button>' +
          (plan && plan.cert ? '' : '<button type="button" class="btn ghost small" data-act="wkroll" data-val="' + ck + '"' + (on ? ' data-clear="1"' : '') + '>다른 메뉴로</button>') +
          '<button type="button" class="btn ghost small" data-act="share" data-val="' + esc(x.n) + '" data-l="휴일 ' + MEAL_NAME[sl] + '" data-d="' + day.k + '">공유</button></div>' + (on ? '<span class="badge">' + (plan.cert ? '인증 완료' : '휴일 메뉴로 정했어요') + '</span>' : '') + '</div></div>';
      }).join('');
      html += '<section class="card"><div class="day-head"><h2>' + fmtDate(day.date) + '</h2><span class="badge">' + esc(day.label) + '</span></div>' + slots + '</section>';
    }
    html += allergyNote() + '<p class="note">식당 정보는 앱에 저장돼 있지 않고, 지도 앱의 검색으로 연결돼요. 영업시간과 메뉴는 지도 앱에서 확인하세요.</p>';
    return html;
  }

  /* ---------- 랜덤 뽑기 (룰렛 · 사다리 타기) ----------
     흐름: 방식 고르기 → 자동/수동으로 만들기 → (수동이면 최대 6개 입력) → 메뉴 정하쥐! → 결과 → 한번 더 하쥐~ / 갈아엎쥐!!! */
  const WHEEL_COLORS = ['#FFE0D2', '#D8EBFA', '#FFF0BD', '#D5EFE0', '#E7DFFB', '#FFDDE6'];
  const PATH_COLORS = ['#E8573F', '#1D7A55', '#7C83E8', '#E59B1E', '#E0568A', '#2F9BD1'];
  const LV = 8, MAXC = 6, MAXREBUILD = 3;
  const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const trunc = (s, k) => s.length > k ? s.slice(0, k - 1) + '…' : s;
  const newRnd = () => ({ game: null, how: null, meal: currentMeal(), nonce: 0, auto: [], manual: ['', '', '', '', '', ''], phase: 'setup', rot: 0, speed: 0, raf: 0, lad: null, startSel: null, result: null, rebuilds: 0 });
  ui.rnd = newRnd();
  const busy = () => ui.rnd.phase === 'running' || ui.rnd.phase === 'stopping';

  // 지금 후보 목록 (자동: 추천 6개 / 수동: 입력한 메뉴, 중복 제거)
  function cands() {
    const r = ui.rnd;
    if (r.how === 'auto') return r.auto.slice();
    const seen = [];
    r.manual.forEach(v => { const t = v.trim(); if (t && !seen.includes(t)) seen.push(t); });
    return seen.slice(0, MAXC);
  }
  function fillAuto() {
    const r = ui.rnd;
    const salt = todayKey() + r.meal + 'r' + r.nonce;
    const pool = rank(r.meal, { seed: salt });
    r.auto = pool.slice().sort((a, b) => hash01(salt + a.n) - hash01(salt + b.n)).slice(0, MAXC).map(x => x.n);
    r.result = null; r.lad = null; r.startSel = null; r.phase = 'setup'; r.rebuilds = 0;
  }
  // 화살표(맨 위) 아래에 놓인 칸 번호

  function wheelSvg(names) {

  const LEVELS = [

  /* ---------- 인증 사진 저장소 (IndexedDB) ----------
     사진은 메뉴 기록(localStorage)과 분리해서 저장해요. IndexedDB를 못 쓰는 환경에서는 예전처럼 기록 안에 넣어요. */
  const imgs = {};

      catch (e) { res(null); }
    });
    return {
      ready,
      put: async (k, v) => (await ready) ? (await tx('readwrite', st => st.put(v, k))) === true : false,
      del: async k => { if (await ready) tx('readwrite', st => st.delete(k)); },
      all: () => new Promise(async res => {
        if (!(await ready)) return res({});
        try { const out = {}, t = db.transaction('img'), st = t.objectStore('img'), c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } }; t.oncomplete = () => res(out); t.onerror = t.onabort = () => res({}); } catch (e) { res({}); }
      }),

        await ready; try { if (db) db.close(); const r = indexedDB.deleteDatabase('omm'); r.onsuccess = r.onerror = r.onblocked = () => res(); } catch (e) { res(); }
        setTimeout(res, 800);

  const REASONS = ['얼굴·몸매가 노출된 사진', '욕설·비방', '광고·스팸', '기타 부적절한 내용'];
  function showReportSheet(pid) {
    if (!sharedMode()) { toast('신고는 공유 게시판에서만 할 수 있어요'); return; }
    if (!ui.uid || !canPost()) { toast('로그인한 사람만 신고할 수 있어요'); return; }
    const p = ui.posts.find(x => x.id === pid); if (!p || p.u === ui.uid) return;
    if (reported(pid)) { toast('이미 신고한 글이에요'); return; }
    sheetShow('<div class="row between"><h2>글 신고하기</h2><button type="button" class="btn ghost small" data-act="sclose">닫기</button></div>' +
      '<p class="hint">' + esc(p.n) + ' · ' + esc(p.k || '익명') + '님의 글. 신고 사유를 골라 주세요. 확인 후 글 삭제와 이용 제재가 이뤄질 수 있어요.</p>' +
      '<button type="button" class="btn" data-act="pblock" data-val="' + esc(pid) + '">이 사용자 차단하기 (글이 안 보여요)</button>' +
      REASONS.map((r, i) => '<button type="button" class="btn" data-act="preport" data-val="' + esc(pid) + '" data-r="' + i + '">' + r + '</button>').join(''));
  }
  async function submitReport(pid, ri) {
    if (!sharedMode() || !ui.uid || reported(pid)) { closeSheet(); return; }
    try { await ui.db.collection('reports').doc(pid + '__' + ui.uid).set({ p: pid, u: ui.uid, r: REASONS[ri] || '기타', ts: Date.now() }); closeSheet(); toast('신고를 접수했어요. 고마워요!'); }
    catch (e) { toast('신고를 저장하지 못했어요'); }
  }
  async function toggleLike(pid) {
    if (!sharedMode() || !ui.uid || !canPost()) { toast('좋아요는 공유 게시판에서 로그인한 사람만 누를 수 있어요'); return; }
    const p = ui.posts.find(x => x.id === pid); if (!p || p.u === ui.uid) return;
    const key = pid + '__' + ui.uid, ref = ui.db.collection('likes').doc(key);
    try { if (ui.likes.some(l => l.id === key)) await ref.delete(); else { sfx('like'); await ref.set({ p: pid, u: ui.uid, ts: Date.now() }); } }
    catch (e) { toast('좋아요를 저장하지 못했어요'); }
  }
  async function deletePost(pid) {
    try {
      if (sharedMode()) { const p = ui.posts.find(x => x.id === pid); if (!p || p.u !== ui.uid) return; await ui.db.collection('posts').doc(pid).delete(); }
      else { localPosts = localPosts.filter(p => p.id !== pid); store.set('lposts', localPosts); render(); }
      toast('글을 지웠어요');
    } catch (e) { toast('글을 지우지 못했어요'); }
  }

  /* ---------- 마이페이지 (내 정보 · 기록 · 내 취향) ---------- */
  function renderMy() {
    const t = ui.myTab || 'info';
    let h = '<header class="top">' + brand('마이페이지') + '</header>' +
      '<div class="seg" role="group" aria-label="마이페이지">' + [['info', '내 정보'], ['log', '기록'], ['pref', '내 취향'], ['guide', '안내'], ['policy', '정책']].map(k => '<button type="button" data-act="mytab" data-val="' + k[0] + '" aria-pressed="' + (t === k[0]) + '">' + k[1] + '</button>').join('') + '</div>';
    if (t === 'log') return h + myLog();
    if (t === 'guide') return h + myGuide();
    if (t === 'policy') return h + myPolicy();
    if (t === 'pref') return h + say('happy', '취향은 언제든 바꿔도 괜찮아. 바로 저장돼!') + [secFood, secTaste, secDislike, secAllergy].map(f => '<section class="card">' + f() + '</section>').join('');
    return h + myInfo();
  }
  function myInfo() {
    const nCert = history.filter(h => h.cert).length, lk = likesReceived(), nPost = sharedMode() ? ui.posts.filter(p => p.u === ui.uid).length : localPosts.length;
    const L = meLv();
    return '<section class="card hero">' + say('happy', '안녕, ' + esc(profile.nick) + '! 오늘도 맛있게 먹었쥐?') +
      '<div class="lvcard"><div class="lvtop"><span class="lvb big">Lv.' + L.lv + '</span><b>' + esc(L.title) + '</b></div>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + L.pct + '"><span style="width:' + L.pct + '%"></span></div>' +
      '<p class="hint">' + (L.next ? '다음 칭호 \'' + esc(L.nextTitle) + '\'까지 ' + (L.next - L.pts) + 'P' : '최고 레벨이에요! 정말 대단해요') + '</p>' +
      '<div class="tchips">' + LEVELS.map((t, i) => '<span class="tc' + (i + 1 <= L.lv ? ' on' : '') + '">Lv.' + (i + 1) + ' ' + (i + 1 <= L.lv ? esc(t[1]) : '???') + '</span>').join('') + '</div></div>' +
      '<div class="pts">' + totalPts().toLocaleString('ko-KR') + '<small> P</small></div>' +
      '<div style="width:100%"><div class="stat"><span>메뉴 인증 ' + nCert + '회 × 50P</span><b>' + points + 'P</b></div>' +
      '<div class="stat"><span>받은 좋아요 ' + lk + '개 × 1P</span><b>' + lk + 'P</b></div>' +
      '<div class="stat"><span>출석체크 ' + attTotal() + '회 × 10P</span><b>' + attPts() + 'P</b></div>' +
      '<div class="stat"><span>광고 시청 ' + adTotal() + '회 × ' + AD_PT + 'P</span><b>' + adPts() + 'P</b></div></div></section>' + attCard() + adCard() +
      '<section class="card"><h2 class="h-ico">' + tileK('egg', 'xs') + '<span>내 정보</span></h2>' +
      '<label class="label" for="nick">닉네임</label><div class="field-row"><input id="nick" class="field" type="text" maxlength="12" value="' + esc(profile.nick) + '" autocomplete="off"><button type="button" class="btn small" data-act="nick">저장</button></div>' +
      '<p class="hint">게시판 글에 이 닉네임이 보여요.</p>' +
      '<div class="stat"><span>이번 달 출석한 날</span><b>' + Object.keys(att).filter(k => k.slice(0, 7) === todayKey().slice(0, 7) && att[k].length).length + '일</b></div><div class="stat"><span>정한 메뉴</span><b>' + history.length + '개</b></div><div class="stat"><span>올린 글</span><b>' + nPost + '개</b></div></section>' +
      sfxCard() +
      '<section class="card"><h2>설정 초기화</h2><p class="hint">취향과 고른 메뉴 기록이 지워지고 처음 설정 화면으로 돌아가요. 인증한 기록과 포인트는 남아요.</p>' +
      '<div><button type="button" class="btn danger small" data-act="reset">' + (ui.confirmReset ? '정말 초기화할게요' : '처음부터 다시 설정') + '</button></div></section>';
  }
  function diaryCard() {
    const me = meLv().lv, d = store.get('lvdates', {}) || {};
    return '<section class="card"><h3>머먹쥐 성장일기</h3><p class="hint">레벨이 오를 때마다 새 이야기가 열려요. 눌러서 다시 볼 수 있어요.</p>' +
      LEVELS.map((L, i) => {
        const n = i + 1;
        if (n <= me) return '<button type="button" class="prow diary" data-act="story" data-val="' + n + '"><span class="lvb">Lv.' + n + '</span><span class="pt"><span class="n">' + esc(L[1]) + '</span><span class="l">' + (d[n] ? shortDate(parseKey(d[n])) + ' · ' : '') + '다시 보기</span></span></button>';
        return '<div class="prow diary locked" aria-label="잠긴 이야기"><span class="lvb">Lv.' + n + '</span><span class="pt"><span class="n">???</span><span class="l">' + L[0] + 'P 모으면 열려요</span></span></div>';
      }).join('') + '</section>';
  }
  function myLog() {
    const list = history.slice().sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts).slice(0, 100);
    if (!list.length) return diaryCard() + say('smile', '아직 기록이 없어. 메뉴를 정하면 여기에 쌓여!');
    return diaryCard() + '<section class="card">' + list.map(e => '<div class="prow">' + tile({ n: e.n }, 'xs') + '<div class="pt"><span class="l">' + shortDate(parseKey(e.date)) + ' · ' + planLabel(e) + '</span><span class="n">' + esc(e.n) + '</span></div>' +
      (e.cert ? '<div class="ac">' + photoTag(e) + '<span class="badge">인증 +50P</span></div>' : '') + '</div>').join('') + '</section>' +
      '<section class="card"><p class="hint">기록을 비워도 인증한 기록과 포인트는 남아요.</p><div><button type="button" class="btn ghost small" data-act="clearhist">인증 안 한 기록 비우기</button></div></section>';
  }
  function saveNick() {
    const el = document.getElementById('nick'); if (!el) return;
    const v = el.value.trim().slice(0, 12);
    if (!v) { toast('닉네임을 적어 줘!'); return; }
    profile.nick = v; saveProfile(); toast('닉네임을 바꿨어요'); render();
  }

  /* ---------- 그리기 ---------- */
  const $app = document.getElementById('app');
  const $nav = document.getElementById('nav');
  const $toast = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    $toast.textContent = msg; $toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $toast.hidden = true; }, 2400);
  }

  function render() {
    const y = window.scrollY;
    if (ui.tab === 'share') {
      ui.shared = parseShare(location.hash);
      $nav.hidden = true;
      $app.innerHTML = renderShared();
    } else if (!profile.done) {
      $nav.hidden = true;
      $app.innerHTML = renderWizard();
    } else {
      $nav.hidden = false;
      $nav.querySelectorAll('[data-val]').forEach(b => b.setAttribute('aria-current', b.dataset.val === ui.tab ? 'page' : 'false'));
      $app.innerHTML = ui.tab === 'weekend' ? renderWeekend() : (ui.tab === 'my' ? renderMy() : (ui.tab === 'board' ? renderBoard() : (ui.tab === 'random' ? renderRandom() : (ui.tab === 'calendar' ? renderCalendar() : renderToday()))));
      const inp = document.getElementById('area');
      if (inp) inp.value = profile.area || '';
    }
    window.scrollTo(0, y);
    checkLevelUp();
  }

  /* ---------- 동작 ---------- */
  function applyArea() {
    const inp = document.getElementById('area');
    if (!inp) return;
    profile.area = inp.value.trim().slice(0, 30);
    saveProfile(); render();
    toast(profile.area ? profile.area + ' 근처로 검색해요' : '지역 설정을 지웠어요');
  }

  document.addEventListener('click', e => {
    if (e.target === sheet) { closeSheet(); return; }
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, val = t.dataset.val, field = t.dataset.field;
    if (act !== 'reset') ui.confirmReset = false;
    if (act !== 'wipe') ui.confirmWipe = false;
    if (act !== 'bkrestore') ui.confirmRestore = false;
    if (busy() && act !== 'tab' && act !== 'rstop') return;
    if (!['attend', 'choose', 'shoot', 'sfxtoggle', 'sreplay'].includes(act)) sfx('tap');

    switch (act) {
      case 'tab': location.hash = val; return;
      case 'toggle': {
        const arr = profile[field];
        const i = arr.indexOf(val);
        if (i >= 0) arr.splice(i, 1); else arr.push(val);
        ui.cur = {}; ui.wk = {};
        saveProfile(); break;
      }
      case 'set':
        profile[field] = (field === 'spicy' || field === 'greasy') ? Number(val) : val;
        ui.cur = {}; ui.wk = {};
        saveProfile(); break;
      case 'next': ui.step = Math.min(ui.step + 1, STEPS.length - 1); window.scrollTo(0, 0); break;
      case 'prev': ui.step = Math.max(ui.step - 1, 0); window.scrollTo(0, 0); break;
      case 'finish':
        profile.done = true; saveProfile();
        ui.meal = currentMeal(); ui.cur = {};
        if (location.hash !== '#today') location.hash = 'today';
        ui.tab = 'today'; window.scrollTo(0, 0);
        toast('좋아, 이제 같이 골라 보자!'); break;
      case 'meal': ui.meal = val; break;
      case 'hang': ui.hangover = !ui.hangover; ui.cur[ui.meal] = 0; break;
      case 'roll': ui.cur[ui.meal] = (ui.cur[ui.meal] || 0) + 1; break;
      case 'pick': ui.cur[ui.meal] = Number(val); window.scrollTo(0, 0); break;
      case 'choose': sfx('pick'); assignPlan(val, todayKey(), ui.meal, false); break;
      case 'clearhist': history = history.filter(h => h.cert); saveHistory(); toast('기록을 비웠어요'); break;
      case 'wkroll': ui.wk[val] = (ui.wk[val] || 0) + 1; break;
      case 'area': applyArea(); return;
      case 'rgame': Object.assign(ui.rnd, { game: val, how: null, phase: 'setup', result: null, lad: null, startSel: null, rebuilds: 0 }); break;
      case 'rhow':
        Object.assign(ui.rnd, { how: val, phase: 'setup', result: null, lad: null, startSel: null, rebuilds: 0 });
        if (val === 'auto') fillAuto();
        break;
      case 'rback':
        if (ui.rnd.how) ui.rnd.how = null; else ui.rnd.game = null;
        Object.assign(ui.rnd, { phase: 'setup', result: null, lad: null, startSel: null, rebuilds: 0 }); break;
      case 'rmeal': ui.rnd.meal = val; ui.rnd.nonce++; fillAuto(); break;
      case 'refill': ui.rnd.nonce++; fillAuto(); toast('메뉴를 싹 갈아엎었쥐!'); break;
      case 'lrebuild':
        if (ui.rnd.phase === 'setup' && ui.rnd.rebuilds < MAXREBUILD) {
          ui.rnd.rebuilds++; ui.rnd.lad = null; ui.rnd.startSel = null;
          refreshVisual();
          toast('사다리 줄을 새로 그렸쥐! (남은 ' + (MAXREBUILD - ui.rnd.rebuilds) + '회)');
        }
        return;
      case 'rgo': if (ui.rnd.game === 'roulette') startRoulette(); else runLadder(); return;
      case 'rstop': stopRoulette(); return;
      case 'lsel':
        if (ui.rnd.phase === 'setup') { ui.rnd.startSel = ui.rnd.startSel === Number(val) ? null : Number(val); refreshVisual(); }
        return;
      case 'ragain':
        Object.assign(ui.rnd, { phase: 'setup', result: null, startSel: null, rebuilds: 0 });
        if (ui.rnd.game === 'ladder') ui.rnd.lad = null;
        break;
      case 'rreset': cancelAnimationFrame(ui.rnd.raf); ui.rnd = newRnd(); toast('싹 갈아엎었쥐!'); break;
      case 'cagree': agreeConsent(); return;
      case 'cdecline': showConsent(true); return;
      case 'cretry': showConsent(false); return;
      case 'alg': setAllergyConsent(val === 'on'); return;
      case 'wipe': if (!ui.confirmWipe) { ui.confirmWipe = true; break; } wipeAll(); return;
      case 'pblock': {
        const p = ui.posts.find(x => x.id === val);
        if (p && p.u && p.u !== ui.uid && !isBlocked(p.u)) { blocked.push({ u: p.u, k: String(p.k || '익명').slice(0, 12) }); store.set('blocked', blocked); }
        closeSheet(); toast('차단했어요. 이 사용자의 글은 보이지 않아요'); break;
      }
      case 'punblock': blocked = blocked.filter(b => b.u !== val); store.set('blocked', blocked); toast('차단을 해제했어요'); break;
      case 'bkmake': ui.backup = backupCode(); break;
      case 'bkcopy': {
        const out = document.getElementById('bkout');
        (navigator.clipboard ? navigator.clipboard.writeText(ui.backup) : Promise.reject()).then(() => toast('백업 코드를 복사했어요')).catch(() => { if (out) { out.focus(); out.select(); } toast('코드를 길게 눌러 복사해 주세요'); });
        return;
      }
      case 'bkrestore': {
        const el = document.getElementById('bkin'), o = el && parseBackup(el.value);
        if (!o) { toast('백업 코드가 올바르지 않아요'); return; }
        if (!ui.confirmRestore) { ui.confirmRestore = true; t.textContent = '정말 덮어쓸게요'; toast('한 번 더 누르면 현재 데이터를 덮어써요'); return; }
        try { applyBackup(o); } catch (e) { toast('저장 공간이 부족해서 복원하지 못했어요'); }
        return;
      }
      case 'bgmtoggle': bgmOn = !bgmOn; store.set('bgm', bgmOn); if (bgmOn) { bgmFails = 0; bgmStart(); } else bgmStop(); render(); setTimeout(bgmLabel, 0); return;
      case 'bgmskip': bgmFails = 0; bgmWant = true; bgmNext(); return;
      case 'gnext': showGuide((ui.guide || 0) + 1); return;
      case 'gprev': showGuide((ui.guide || 0) - 1); return;
      case 'gdone': closeSheet(); return;
      case 'gopen': showGuide(0); return;
      case 'sfxtoggle': sfxOn = !sfxOn; store.set('sfx', sfxOn); sfx('ok'); render(); return;
      case 'attend': attend(); return;
      case 'story': { const lv = parseInt(val, 10); if (lv >= 1 && lv <= LEVELS.length && lv <= meLv().lv) openStory(lv, false); return; }
      case 'sreplay': { const s = ui.story; if (s && s.done) { cancelAnimationFrame(s.raf); playStory(s, true); } return; }
      case 'sshare': shareStory(); return;
      case 'sskip': { const s = ui.story; if (s && !s.done) { s.skipped = true; s.skipT = ST_DUR; } return; }
      case 'adopen': showAdSheet(); return;
      case 'adclaim': claimAd(); return;
      case 'goatt': closeSheet(); if (location.hash !== '#' + val) location.hash = val; else render(); return;
      case 'bnew': showPostSheet(); return;
      case 'prep': showReportSheet(val); return;
      case 'preport': submitReport(val, Number(t.dataset.r)); return;
      case 'pfill': { const el = document.getElementById('pn'); if (el) { el.value = val; el.focus(); } return; }
      case 'ppost': submitPost(); return;
      case 'like': toggleLike(val); return;
      case 'pdel': deletePost(val); return;
      case 'bsort': ui.bsort = val; break;
      case 'mytab': ui.myTab = val; if (ui.tab !== 'my') { location.hash = 'my'; return; } break;
      case 'nick': saveNick(); return;
      case 'plan': assignPlan(val, t.dataset.d, t.dataset.m, t.dataset.h === '1'); break;
      case 'share': openShare(val, t.dataset.l, t.dataset.d); return;
      case 'sharimg': shareImage(); return;
      case 'sharelink': shareLink(); return;
      case 'sharecopy': copyLink(); return;
      case 'sclose': closeSheet(); return;
      case 'cam': openCam(t.dataset.d, t.dataset.m); return;
      case 'shoot': shoot(); return;
      case 'retake': startCam(); return;
      case 'usecam': useShot(); return;
      case 'cday': ui.cal.sel = val; break;
      case 'cprev': case 'cnext': {
        const d = new Date(ui.cal.y, ui.cal.m + (act === 'cnext' ? 1 : -1), 1);
        ui.cal.y = d.getFullYear(); ui.cal.m = d.getMonth();
        ui.cal.sel = (d.getFullYear() === new Date().getFullYear() && d.getMonth() === new Date().getMonth()) ? todayKey() : dayKey(d);
        break;
      }
      case 'reset':
        if (!ui.confirmReset) { ui.confirmReset = true; break; }
        profile = Object.assign({}, DEFAULT, { cuisines: [], kinds: [], dislikes: [], allergens: [], nick: profile.nick });
        history = history.filter(h => h.cert); saveProfile(); saveHistory();
        ui.step = 0; ui.confirmReset = false; ui.cur = {}; ui.wk = {};
        window.scrollTo(0, 0); break;
    }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet();
    if (e.key === 'Enter' && e.target && e.target.id === 'nick') { e.preventDefault(); saveNick(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'pt') { e.preventDefault(); submitPost(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'area') { e.preventDefault(); applyArea(); }
    if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('minput')) {
      e.preventDefault();
      const next = document.querySelector('.minput[data-i="' + (Number(e.target.dataset.i) + 1) + '"]');
      if (next) next.focus(); else e.target.blur();
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.dataset && e.target.dataset.act === 'lsel') {
      e.preventDefault();
      if (ui.rnd.phase === 'setup') { const v = Number(e.target.dataset.val); ui.rnd.startSel = ui.rnd.startSel === v ? null : v; refreshVisual(); }
    }
  });

  // 수동 입력: 입력할 때마다 룰렛/사다리를 바로 다시 그림 (입력칸은 그대로 둬서 커서가 안 사라짐)
  document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('cchk')) syncConsent(e.target); });
  document.addEventListener('input', e => {
    const t = e.target;
    if (!t.classList || !t.classList.contains('minput')) return;
    const r = ui.rnd;
    r.manual[Number(t.dataset.i)] = t.value;
    if (r.phase === 'done') { r.phase = 'setup'; r.result = null; const res = document.getElementById('result'); if (res) res.remove(); }
    refreshVisual();
  });

  window.addEventListener('hashchange', () => {
    ui.tab = tabFromHash();
    ui.confirmReset = false;
    if (!sheet.hidden) closeSheet();
    render();
    window.scrollTo(0, 0);
  });

  render();
  initBoard();
  loadPhotos();
  // 로딩 화면: 짧게 보여 주고 부드럽게 사라져요
  (function () {
    const sp = document.getElementById('splash');
    if (!sp) return;
    const t0 = Date.now(), ready = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]) : Promise.resolve();
    const enter = () => { sp.classList.add('out'); setTimeout(() => { sp.remove(); showConsent(); showGuideIfNeeded(); showAttWelcome(); }, 450); };
    ready.then(() => setTimeout(() => {
      if (ui.tab === 'share') { enter(); return; }
      // 로딩이 끝나면 '시작하기' 버튼을 보여 줘요 (이 버튼을 누르는 순간 배경 음악도 시작돼요)
      sp.classList.add('wait'); sp.setAttribute('aria-label', '오머먹 시작 화면');
      const sub = sp.querySelector('.ssub'); if (sub) sub.textContent = '오늘 뭐 먹지? 머먹쥐랑 같이 골라 봐요!';
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn primary startbtn'; btn.textContent = '오머먹 시작하기';
      btn.addEventListener('click', () => { btn.disabled = true; bgmStart(); sfx('pick'); enter(); });
      sp.appendChild(btn); try { btn.focus({ preventScroll: true }); } catch (e) {}
    }, Math.max(0, 1000 - (Date.now() - t0))));
  })();
})();

</script>

<script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
